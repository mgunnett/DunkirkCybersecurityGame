<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helm</title>
<link rel="stylesheet" href="shipstyle.css">
</head>
<body>

<div class="helm">

  <!-- Deckhead, right above the eye -->
  <div class="deckhead" aria-hidden="true">
    <span class="beam"></span><span class="beam"></span><span class="beam"></span><span class="beam"></span>
  </div>

  <!-- The windscreen. Seated, you see less of it. -->
  <div class="windshield">
    <div class="view" id="view">

      <div class="horizon" id="horizon">
        <div class="sky"></div>
        <div class="haze"></div>
        <div class="sea"></div>
        <div class="swell" id="swell"></div>
        <div class="world" id="world"></div>
      </div>

      <svg class="foredeck" viewBox="0 0 1000 260" preserveAspectRatio="none" aria-hidden="true">
        <path class="deck__wake" d="M404 112 C450 92 550 92 596 112 C540 100 460 100 404 112 Z"/>
        <path class="deck__hull" d="M0 260 L0 218 C250 156 410 108 500 100 C590 108 750 156 1000 218 L1000 260 Z"/>
        <path class="deck__rail" d="M0 218 C250 156 410 108 500 100 C590 108 750 156 1000 218"/>
        <path class="deck__seam" d="M0 252 C260 196 420 152 500 146 C580 152 740 196 1000 252"/>
        <rect class="deck__hatch" x="452" y="186" width="96" height="34" rx="4"/>
        <line class="deck__mast" x1="500" y1="0" x2="500" y2="150"/>
        <path class="deck__pulpit" d="M420 152 L432 112 M580 152 L568 112 M432 112 Q500 96 568 112"/>
      </svg>

      <div class="glare" aria-hidden="true"></div>
    </div>

    <div class="mullion mullion--left" aria-hidden="true"></div>
    <div class="mullion mullion--right" aria-hidden="true"></div>
  </div>

  <!-- Cabin sides, splaying out towards the eye -->
  <div class="cabinside cabinside--port" aria-hidden="true"></div>
  <div class="cabinside cabinside--stbd" aria-hidden="true"></div>

  <!-- The varnished dash top, running away from you -->
  <div class="dashtop" aria-hidden="true"></div>

  <!-- Binnacle: stands on the dash, right behind the wheel -->
  <svg class="binnacle" viewBox="0 0 240 420" role="img" aria-label="Binnacle compass">
    <ellipse class="bin__shadow" cx="120" cy="404" rx="96" ry="14"/>

    <circle class="brass" cx="120" cy="40" r="10"/>
    <path class="brass" d="M98 56 L142 56 L137 74 L103 74 Z"/>
    <path class="brass brass--dark" d="M64 172 L97 72 L143 72 L176 172 Z"/>
    <path class="bin__rib" d="M102 76 L82 170 M120 74 L120 170 M138 76 L158 170"/>
    <rect class="brass" x="54" y="166" width="132" height="16" rx="4"/>

    <circle class="brass brass--dark" cx="120" cy="254" r="78"/>
    <circle class="bin__bowl" cx="120" cy="254" r="68"/>

    <g id="compassCard">
      <circle class="card__face" cx="120" cy="254" r="62"/>
      <path class="card__tick" d="M161 213 L164 210 M79 213 L76 210 M161 295 L164 298 M79 295 L76 298"/>
      <path class="card__north" d="M120 216 L127 254 L113 254 Z"/>
      <path class="card__south" d="M113 254 L127 254 L120 292 Z"/>
      <text class="card__letter" x="120" y="203">N</text>
      <text class="card__letter" x="171" y="254">E</text>
      <text class="card__letter" x="120" y="305">S</text>
      <text class="card__letter" x="69" y="254">W</text>
    </g>

    <path class="bin__sheen" d="M78 230 A62 62 0 0 1 132 194 A62 62 0 0 0 78 230 Z"/>
    <path class="bin__lubber" d="M120 184 L120 202"/>
    <path class="bin__lubberhead" d="M113 180 L127 180 L120 192 Z"/>

    <path class="brass" d="M80 316 L160 316 L170 390 L70 390 Z"/>
    <rect class="bin__plate" x="82" y="330" width="76" height="28" rx="3"/>
    <text class="bin__reading" id="headingPlate" x="120" y="349">000&#176;</text>
    <rect class="brass" x="56" y="386" width="128" height="16" rx="3"/>
  </svg>

  <!-- Dash face with the working instruments -->
  <div class="dashface">
    <div class="dashface__lip" aria-hidden="true"></div>

    <svg class="dial dial--port" viewBox="0 0 130 130" role="img" aria-label="Rudder angle indicator">
      <circle class="dial__bezel" cx="65" cy="65" r="58"/>
      <circle class="dial__face" cx="65" cy="65" r="50"/>
      <path class="dial__arc" d="M25 42 A50 50 0 0 1 105 42"/>
      <path class="dial__tick" d="M65 17 L65 27 M31 31 L38 38 M99 31 L92 38 M17 65 L27 65 M113 65 L103 65"/>
      <text class="dial__side dial__side--port" x="30" y="86">P</text>
      <text class="dial__side dial__side--stbd" x="100" y="86">S</text>
      <g id="rudderNeedle">
        <path class="dial__needle" d="M65 74 L61 68 L65 24 L69 68 Z"/>
      </g>
      <circle class="dial__cap" cx="65" cy="72" r="7"/>
      <text class="dial__label" x="65" y="105">Rudder</text>
    </svg>

    <svg class="dial dial--stbd" viewBox="0 0 130 130" role="img" aria-label="Patent log">
      <circle class="dial__bezel" cx="65" cy="65" r="58"/>
      <circle class="dial__face" cx="65" cy="65" r="50"/>
      <path class="dial__tick" d="M65 17 L65 26 M113 65 L104 65 M65 113 L65 104 M17 65 L26 65 M99 31 L93 37 M99 99 L93 93 M31 99 L37 93 M31 31 L37 37"/>
      <g id="logNeedle">
        <path class="dial__needle" d="M65 70 L61 64 L65 22 L69 64 Z"/>
      </g>
      <circle class="dial__cap" cx="65" cy="65" r="7"/>
      <rect class="dial__window" x="38" y="74" width="54" height="17" rx="2"/>
      <text class="dial__counter" id="logCounter" x="65" y="87">0.00</text>
      <text class="dial__label" x="65" y="106">Log, nm</text>
    </svg>

    <p class="speedplate">Half ahead &middot; 15 knots</p>
  </div>

  <!-- Nearest thing to the eye: the wheel in your hands -->
  <svg class="wheel" id="wheel" viewBox="-115 -115 230 230" role="img" aria-label="Ship's wheel, drag to steer">
    <defs>
      <g id="spoke">
        <path class="wheel__spoke" d="M-5 -20 L-4 -74 L-7 -74 L-7 -96 L7 -96 L7 -74 L4 -74 L5 -20 Z"/>
        <circle class="wheel__collar" cx="0" cy="-70" r="7"/>
        <circle class="wheel__grip" cx="0" cy="-101" r="7.5"/>
      </g>
    </defs>
    <circle class="wheel__hit" cx="0" cy="0" r="112"/>
    <g id="rotor">
      <use href="#spoke" transform="rotate(0)"/>
      <use href="#spoke" transform="rotate(60)"/>
      <use href="#spoke" transform="rotate(120)"/>
      <use href="#spoke" transform="rotate(180)"/>
      <use href="#spoke" transform="rotate(240)"/>
      <use href="#spoke" transform="rotate(300)"/>
      <circle class="wheel__rim" cx="0" cy="0" r="72"/>
      <circle class="wheel__rim wheel__rim--light" cx="0" cy="0" r="69"/>
      <circle class="wheel__hub" cx="0" cy="0" r="19"/>
      <circle class="wheel__nut" cx="0" cy="0" r="6"/>
      <circle class="wheel__king" cx="0" cy="-101" r="7.5"/>
    </g>
  </svg>

  <div class="gloom" aria-hidden="true"></div>
</div>

<!-- Artwork for things outside the window. Shapes here, colours in the stylesheet. -->
<template id="art-land">
  <svg class="art art--land" viewBox="0 0 600 120" preserveAspectRatio="none">
    <path d="M0 120 L0 117 L44 104 L96 72 L152 88 L214 46 L268 70 L330 38 L392 72 L448 56 L508 86 L556 106 L600 117 L600 120 Z"/>
  </svg>
</template>

<template id="art-island">
  <svg class="art art--island" viewBox="0 0 240 90" preserveAspectRatio="none">
    <path d="M0 90 L0 87 L38 76 L92 28 L140 58 L188 46 L240 87 L240 90 Z"/>
  </svg>
</template>

<template id="art-lighthouse">
  <svg class="art art--lighthouse" viewBox="0 0 44 130" preserveAspectRatio="none">
    <path class="art__rock" d="M0 130 L5 114 L39 114 L44 130 Z"/>
    <path class="art__tower" d="M15 116 L17 38 L27 38 L29 116 Z"/>
    <rect class="art__band" x="16" y="62" width="12" height="16"/>
    <rect class="art__lantern" x="14" y="24" width="16" height="14" rx="2"/>
    <path class="art__cap" d="M12 24 L22 12 L32 24 Z"/>
  </svg>
</template>

<template id="art-buoy-port">
  <svg class="art art--buoy art--port" viewBox="0 0 26 78" preserveAspectRatio="none">
    <path class="art__body" d="M7 68 L6 34 L20 34 L19 68 Z"/>
    <rect class="art__mast" x="12" y="12" width="2" height="24"/>
    <rect class="art__topmark" x="6" y="4" width="14" height="10"/>
    <path class="art__wash" d="M1 70 Q13 62 25 70 Q13 77 1 70 Z"/>
  </svg>
</template>

<template id="art-buoy-starboard">
  <svg class="art art--buoy art--starboard" viewBox="0 0 26 78" preserveAspectRatio="none">
    <path class="art__body" d="M6 68 L7 36 L19 36 L20 68 Z"/>
    <rect class="art__mast" x="12" y="14" width="2" height="24"/>
    <path class="art__topmark" d="M13 2 L20 16 L6 16 Z"/>
    <path class="art__wash" d="M1 70 Q13 62 25 70 Q13 77 1 70 Z"/>
  </svg>
</template>

<template id="art-sloop">
  <svg class="art art--sloop" viewBox="0 0 64 96" preserveAspectRatio="none">
    <path class="art__main" d="M33 6 L33 70 L56 70 Z"/>
    <path class="art__jib" d="M31 10 L31 70 L12 70 Z"/>
    <path class="art__hull" d="M6 70 L60 70 L52 82 L14 82 Z"/>
  </svg>
</template>

<template id="art-freighter">
  <svg class="art art--freighter" viewBox="0 0 300 84" preserveAspectRatio="none">
    <path class="art__hull" d="M6 54 L294 54 L276 76 L24 76 Z"/>
    <rect class="art__box" x="54" y="36" width="42" height="18"/>
    <rect class="art__box" x="104" y="30" width="46" height="24"/>
    <rect class="art__box" x="158" y="38" width="38" height="16"/>
    <rect class="art__house" x="212" y="18" width="46" height="36"/>
    <rect class="art__stack" x="230" y="4" width="12" height="16"/>
  </svg>
</template>

<script>
(() => {
  'use strict';

  // ---- Tuning -------------------------------------------------------------
  const WHEEL_STOP = 540;    // wheel travel each way, degrees
  const RUDDER_MAX = 35;     // rudder travel each way, degrees
  const TURN_GAIN  = 0.62;   // heading deg/sec per degree of rudder, at cruise
  const SPEED      = 7.7;    // metres per second, held constant (about 15 knots)
  const EYE        = 3.6;    // height of your eye above the water, metres
  const WORLD      = 4000;   // the sea repeats every 4 km, in both directions
  const FOV        = 68;     // degrees of bearing across the horizon layer
  const HAZE       = 4200;   // metres at which things fade out entirely
  const WAKE_NEAR  = 3.2;    // px of wave scroll per metre run, near water
  const WAKE_FAR   = 1.1;    // and for the slower, more distant band
  const NEEDLE     = 1.7;    // degrees of needle per degree of rudder

  // ---- The sea room, in metres. x is east, y is north. --------------------
  // w and h are real sizes, so range alone decides how big a thing looks.
  const SCENE = [
    { art: 'buoy-port',      x:  -48, y:   210, w: 3.4, h:  11 },
    { art: 'buoy-starboard', x:   52, y:   265, w: 3.4, h:  11 },
    { art: 'buoy-port',      x:  -62, y:   760, w: 3.4, h:  11 },
    { art: 'buoy-starboard', x:   68, y:   840, w: 3.4, h:  11 },
    { art: 'sloop',          x:  250, y:   520, w:  12, h:  16 },
    { art: 'sloop',          x: -880, y:  1600, w:  12, h:  16 },
    { art: 'lighthouse',     x: -520, y:   900, w:  12, h:  42 },
    { art: 'freighter',      x: 1400, y: -1500, w: 180, h:  40 },
    { art: 'island',         x:  900, y:  1300, w: 700, h: 130 },
    { art: 'island',         x:-1500, y:  -900, w: 600, h:  90 },
    { art: 'land',           x:-1450, y:  1250, w:2000, h: 185 },
    { art: 'land',           x:  500, y: -1750, w:2200, h: 175 }
  ];

  // ---- State --------------------------------------------------------------
  let wheelAngle = 0;
  let heading    = 0;        // degrees true
  let boatX      = 0;        // metres east
  let boatY      = -80;      // metres north, starting just short of the channel
  let run        = 0;        // metres run through the water
  let dragging   = false;
  let lastGrab   = 0;
  let ppd        = 12;       // pixels per degree, set by layout()
  let horizonW   = 0;
  let horizonH   = 0;
  const marks    = [];

  const el = {
    wheel:   document.getElementById('wheel'),
    rotor:   document.getElementById('rotor'),
    horizon: document.getElementById('horizon'),
    world:   document.getElementById('world'),
    swell:   document.getElementById('swell'),
    card:    document.getElementById('compassCard'),
    plate:   document.getElementById('headingPlate'),
    rudder:  document.getElementById('rudderNeedle'),
    logHand: document.getElementById('logNeedle'),
    logText: document.getElementById('logCounter')
  };

  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const norm  = d => ((d % 360) + 360) % 360;
  const DEG   = 180 / Math.PI;

  const arc = (a, b) => {                        // shortest signed way round
    let d = norm(b) - norm(a);
    if (d > 180) d -= 360;
    if (d < -180) d += 360;
    return d;
  };

  // Wrap a distance into the nearest copy of the repeating sea
  const wrap = v => ((v + WORLD / 2) % WORLD + WORLD) % WORLD - WORLD / 2;

  // How wide something stands in the eye, and how tall it rises from the water
  const subtendW = (size, range) => 2 * Math.atan(size / (2 * range)) * DEG;
  const subtendH = (size, range) => Math.atan(size / range) * DEG;

  // ---- Build the world ----------------------------------------------------
  function buildWorld() {
    SCENE.forEach(item => {
      const source = document.getElementById('art-' + item.art);
      const holder = document.createElement('div');
      holder.className = 'mark';
      holder.appendChild(source.content.firstElementChild.cloneNode(true));
      el.world.appendChild(holder);
      marks.push({ el: holder, x: item.x, y: item.y, w: item.w, h: item.h, shown: true });
    });
  }

  function layout() {
    horizonW = el.horizon.clientWidth;
    horizonH = el.horizon.clientHeight;
    ppd = horizonW / FOV;
  }

  // ---- Steering: pointer only ---------------------------------------------
  function grabAngle(ev) {
    const box = el.wheel.getBoundingClientRect();
    const x = ev.clientX - (box.left + box.width / 2);
    const y = ev.clientY - (box.top + box.height / 2);
    return Math.atan2(y, x) * DEG;
  }

  el.wheel.addEventListener('pointerdown', ev => {
    dragging = true;
    lastGrab = grabAngle(ev);
    el.wheel.setPointerCapture(ev.pointerId);
    el.wheel.classList.add('is-held');
  });

  el.wheel.addEventListener('pointermove', ev => {
    if (!dragging) return;
    const now = grabAngle(ev);
    let step = now - lastGrab;
    if (step > 180) step -= 360;                 // unwrap across the +/-180 seam
    if (step < -180) step += 360;
    wheelAngle = clamp(wheelAngle + step, -WHEEL_STOP, WHEEL_STOP);
    lastGrab = now;
  });

  const release = ev => {
    if (!dragging) return;
    dragging = false;
    el.wheel.classList.remove('is-held');
    if (ev.pointerId !== undefined && el.wheel.hasPointerCapture(ev.pointerId)) {
      el.wheel.releasePointerCapture(ev.pointerId);
    }
  };
  el.wheel.addEventListener('pointerup', release);
  el.wheel.addEventListener('pointercancel', release);

  // ---- Loop ---------------------------------------------------------------
  const stillness = window.matchMedia('(prefers-reduced-motion: reduce)');
  let last = performance.now();
  let clock = 0;

  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    clock += dt;

    const rudder = clamp(wheelAngle / (WHEEL_STOP / RUDDER_MAX), -RUDDER_MAX, RUDDER_MAX);
    heading = norm(heading + rudder * TURN_GAIN * dt);

    // She never stops: always a step forward along the current heading.
    const rad = heading / DEG;
    boatX += Math.sin(rad) * SPEED * dt;
    boatY += Math.cos(rad) * SPEED * dt;
    run   += SPEED * dt;

    drawWorld();
    drawStation(rudder);
    requestAnimationFrame(frame);
  }

  function drawWorld() {
    const centre = horizonW / 2;
    const waterline = horizonH * 0.46;
    const edge = FOV / 2 + 4;

    for (const m of marks) {
      const dx = wrap(m.x - boatX);
      const dy = wrap(m.y - boatY);
      const range = Math.max(Math.hypot(dx, dy), 12);
      const rel = arc(heading, Math.atan2(dx, dy) * DEG);
      const angW = Math.min(subtendW(m.w, range), 150);

      if (Math.abs(rel) > edge + angW / 2 || range > HAZE) {
        if (m.shown) { m.el.style.display = 'none'; m.shown = false; }
        continue;
      }
      if (!m.shown) { m.el.style.display = 'block'; m.shown = true; }

      const angH = Math.min(subtendH(m.h, range), 70);
      const dip  = subtendH(EYE, range);          // how far below the horizon it sits

      m.el.style.left   = (centre + rel * ppd) + 'px';
      m.el.style.width  = (angW * ppd) + 'px';
      m.el.style.height = (angH * ppd) + 'px';
      m.el.style.bottom = (waterline - dip * ppd) + 'px';
      m.el.style.opacity = clamp(1.12 - range / HAZE, 0.08, 1);
      m.el.style.zIndex = Math.round(clamp(HAZE - range, 0, HAZE) / 4);
    }

    // Water: slides sideways as you turn, and towards you as you make way.
    const side = -norm(heading) * ppd;
    el.swell.style.backgroundPosition =
      (side * 0.35).toFixed(1) + 'px ' + ((run * WAKE_NEAR) % 4000).toFixed(1) + 'px, ' +
      (side * 0.18).toFixed(1) + 'px ' + ((run * WAKE_FAR) % 4000).toFixed(1) + 'px';

    if (stillness.matches) {
      el.horizon.style.transform = 'none';
    } else {
      const roll  = Math.sin(clock * 0.62) * 0.75 + Math.sin(clock * 1.43) * 0.3;
      const heave = Math.sin(clock * 0.47) * 5;
      el.horizon.style.transform =
        'translateY(' + heave.toFixed(1) + 'px) rotate(' + roll.toFixed(2) + 'deg)';
    }
  }

  function drawStation(rudder) {
    el.rotor.setAttribute('transform', 'rotate(' + wheelAngle.toFixed(2) + ')');

    // A magnetic card stays put while the boat turns under it.
    el.card.setAttribute('transform', 'rotate(' + (-heading).toFixed(2) + ' 120 254)');
    el.plate.textContent = String(Math.round(heading) % 360).padStart(3, '0') + '\u00B0';

    el.rudder.setAttribute('transform',
      'rotate(' + (rudder * NEEDLE).toFixed(2) + ' 65 72)');

    const miles = run / 1852;
    el.logHand.setAttribute('transform',
      'rotate(' + ((miles % 1) * 360).toFixed(1) + ' 65 65)');
    el.logText.textContent = miles.toFixed(2);
  }

  buildWorld();
  layout();
  window.addEventListener('resize', layout);
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
