<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teleprinter</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Oswald:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="telex.css">
<link rel="stylesheet" href="decoder.css">
<link rel="stylesheet" href="desk.css">
</head>
<body>

<div class="deck">

  <!-- ==============================================================
       THE PROP. Everything from here to the end of .machine is what
       you drop into the ship. It sizes itself from two custom
       properties, so to fit it into the helm set them on a wrapper:

           .my-helm-panel { --telex-width: 300px;
                            --telex-height: 380px; }

       or give .machine width and height directly.
       ============================================================== -->
  <div class="machine" id="machine">

    <div class="bay" id="bay">
      <p class="idle" id="idlenote">No traffic</p>
    </div>

    <div class="platen" id="platen" title="Tear off"></div>

    <div class="console">
      <div class="lampwrap" id="lampwrap" title="Message waiting">
        <div class="bezel"><div class="lens"></div></div>
      </div>

      <div class="plate">Teleprinter</div>

      <button class="push" id="receive" disabled>
        <span class="cap">Receive</span>
      </button>
    </div>
  </div>
  <!-- ============================ end of prop ==================== -->

  <details class="gm" id="gm" open>
    <summary><span>Operator panel</span><span>signals from Dover</span></summary>
    <div class="gmbody" id="gmbody"></div>
  </details>
</div>

<!-- The enlarged sheet. Lives outside .machine so it can cover the
     whole screen regardless of how small the prop is. -->
<div class="viewer" id="viewer">
  <div class="viewerwrap" role="dialog" aria-modal="true" aria-label="Signal">
    <button class="close" id="closeview" aria-label="Put the paper back"></button>
    <div class="viewerpaper" id="viewerpaper"></div>
    <!-- Desk tools: filled by decoder.js for keys, enciphered signals
         and signals the player has to judge. -->
    <aside class="tools" id="tools" aria-label="Cipher desk tools" hidden></aside>
  </div>
</div>

<!-- ==============================================================
     THE CIPHER DESK. Every telegram is filed here once it has been
     read. The button can go anywhere in the helm; the desk itself
     covers the screen, under the enlarged sheet.
     ============================================================== -->
<button class="deskopen" id="deskopen" type="button" aria-haspopup="dialog" aria-expanded="false">
  Cipher desk <b id="deskcount">0</b>
</button>

<div class="desk" id="desk" role="dialog" aria-modal="true" aria-label="Cipher desk" hidden>
  <header class="desk__bar">
    <div class="desk__plate">Cipher desk</div>
    <div class="desk__filters" role="group" aria-label="Show">
      <button type="button" data-filter="all" aria-pressed="true">All <b>0</b></button>
      <button type="button" data-filter="cipher" aria-pressed="false">Cipher <b>0</b></button>
      <button type="button" data-filter="plain" aria-pressed="false">Plain <b>0</b></button>
    </div>
    <button class="desk__tidy" id="desktidy" type="button">Tidy</button>
    <p class="desk__hint">Drag pages to arrange them. Drop a key on a cipher message to clip it; pull a key off to unclip it. Click a page to read it.</p>
    <button class="close" id="deskclose" type="button" aria-label="Put the desk away"></button>
  </header>
  <div class="desk__surface" id="desksurface">
    <p class="desk__empty" id="deskempty"></p>
  </div>
</div>

<script src="config.js" defer></script>
<script src="telex.js" defer></script>
<script src="desk.js" defer></script>
<script src="decoder.js" defer></script>
<script src="signals/manifest.js" defer></script>
</body>
</html>
