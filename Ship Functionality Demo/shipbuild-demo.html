<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shipbuild Demo</title>
<link rel="stylesheet" href="shipstyle.css">
</head>
<body>

<div class="helm">

  <!-- Deckhead, right above the eye -->
  <div class="deckhead" aria-hidden="true">
    <span class="beam"></span><span class="beam"></span><span class="beam"></span><span class="beam"></span>
  </div>

  <!-- The windscreen. Seated, you see less of it. -->
  <div class="windshield">
    <div class="view" id="view">

      <div class="horizon" id="horizon">
        <div class="sky"></div>
        <div class="horizon__clouds" id="clouds"></div>
        <div class="haze"></div>
        <div class="sea"></div>
        <div class="swell" id="swell"></div>
        <canvas class="surface" id="surface"></canvas>
        <div class="world" id="world"></div>
        <div class="air" id="air"></div>
      </div>

      <svg class="foredeck" viewBox="0 0 1000 260" preserveAspectRatio="none" aria-hidden="true">
        <path class="deck__wake" d="M404 112 C450 92 550 92 596 112 C540 100 460 100 404 112 Z"/>
        <path class="deck__hull" d="M0 260 L0 218 C250 156 410 108 500 100 C590 108 750 156 1000 218 L1000 260 Z"/>
        <path class="deck__rail" d="M0 218 C250 156 410 108 500 100 C590 108 750 156 1000 218"/>
        <path class="deck__seam" d="M0 252 C260 196 420 152 500 146 C580 152 740 196 1000 252"/>
        <rect class="deck__hatch" x="452" y="186" width="96" height="34" rx="4"/>
        <line class="deck__mast" x1="500" y1="0" x2="500" y2="150"/>
        <path class="deck__pulpit" d="M420 152 L432 112 M580 152 L568 112 M432 112 Q500 96 568 112"/>
      </svg>

      <div class="glare" aria-hidden="true"></div>
    </div>

    <div class="mullion mullion--left" aria-hidden="true"></div>
    <div class="mullion mullion--right" aria-hidden="true"></div>
  </div>

  <!-- Cabin sides, splaying out towards the eye -->
  <div class="cabinside cabinside--port" aria-hidden="true"></div>
  <div class="cabinside cabinside--stbd" aria-hidden="true"></div>

  <!-- The varnished dash top, running away from you -->
  <div class="dashtop" aria-hidden="true"></div>

  <!-- Binnacle: stands on the dash, right behind the wheel -->
  <svg class="binnacle" viewBox="0 0 240 420" role="img" aria-label="Binnacle compass">
    <ellipse class="bin__shadow" cx="120" cy="404" rx="96" ry="14"/>

    <circle class="brass" cx="120" cy="40" r="10"/>
    <path class="brass" d="M98 56 L142 56 L137 74 L103 74 Z"/>
    <path class="brass brass--dark" d="M64 172 L97 72 L143 72 L176 172 Z"/>
    <path class="bin__rib" d="M102 76 L82 170 M120 74 L120 170 M138 76 L158 170"/>
    <rect class="brass" x="54" y="166" width="132" height="16" rx="4"/>

    <circle class="brass brass--dark" cx="120" cy="254" r="78"/>
    <circle class="bin__bowl" cx="120" cy="254" r="68"/>

    <!-- A steering card: read your heading where it meets the lubber line at the top.
         Graduations and figures are drawn onto #cardMarks by buildCard(). -->
    <g id="compassCard">
      <circle class="card__face" cx="120" cy="254" r="62"/>
      <g id="cardMarks"></g>
      <path class="card__rose" d="M120 226 L125 254 L120 282 L115 254 Z M92 254 L120 249 L148 254 L120 259 Z"/>
      <path class="card__north" d="M120 222 L126 244 L120 240 L114 244 Z"/>
      <circle class="card__pivot" cx="120" cy="254" r="3.5"/>
    </g>

    <path class="bin__sheen" d="M78 230 A62 62 0 0 1 132 194 A62 62 0 0 0 78 230 Z"/>
    <path class="bin__lubber" d="M120 184 L120 205"/>
    <path class="bin__lubberhead" d="M113 180 L127 180 L120 192 Z"/>

    <path class="brass" d="M80 316 L160 316 L170 390 L70 390 Z"/>
    <rect class="bin__plate" x="82" y="330" width="76" height="28" rx="3"/>
    <text class="bin__reading" id="headingPlate" x="120" y="349">000&#176;</text>
    <rect class="brass" x="56" y="386" width="128" height="16" rx="3"/>
  </svg>

  <!-- Binoculars, stood on the dash top to port of the binnacle. Click to raise them. -->
  <button class="prop binoculars" id="binoculars" type="button"
          aria-label="Binoculars: raise them to look out" data-label="Binoculars">
    <svg viewBox="0 0 200 130" aria-hidden="true">
      <defs>
        <linearGradient id="binoLeather" x1="0" x2="1" y1="0" y2="0">
          <stop offset="0" stop-color="#110a06"/>
          <stop offset="0.45" stop-color="#3b2819"/>
          <stop offset="1" stop-color="#140c07"/>
        </linearGradient>
      </defs>
      <ellipse class="bino__shadow" cx="100" cy="122" rx="94" ry="8"/>

      <rect class="brass brass--dark" x="84" y="52" width="32" height="12" rx="3"/>
      <rect class="brass brass--dark" x="84" y="92" width="32" height="12" rx="3"/>
      <rect class="brass" x="93" y="30" width="14" height="74" rx="5"/>
      <rect class="bino__knurl" x="89" y="36" width="22" height="15" rx="3"/>
      <path class="bino__grip" d="M93 38 L93 49 M97 38 L97 49 M101 38 L101 49 M105 38 L105 49"/>

      <path class="bino__body" d="M30 44 L84 44 L90 114 L22 114 Z"/>
      <path class="bino__body" d="M116 44 L170 44 L178 114 L110 114 Z"/>
      <path class="bino__band" d="M27 76 L87 76 L88 85 L26 85 Z"/>
      <path class="bino__band" d="M113 76 L173 76 L174 85 L112 85 Z"/>
      <path class="bino__sheen" d="M37 48 L44 48 L40 110 L32 110 Z"/>
      <path class="bino__sheen" d="M123 48 L130 48 L126 110 L118 110 Z"/>

      <rect class="brass" x="19" y="110" width="74" height="10" rx="3"/>
      <rect class="brass" x="107" y="110" width="74" height="10" rx="3"/>

      <rect class="brass" x="36" y="26" width="42" height="20" rx="4"/>
      <rect class="brass" x="122" y="26" width="42" height="20" rx="4"/>
      <ellipse class="bino__cup" cx="57" cy="26" rx="24" ry="7.5"/>
      <ellipse class="bino__cup" cx="143" cy="26" rx="24" ry="7.5"/>
      <ellipse class="bino__glass" cx="57" cy="26" rx="15" ry="4.5"/>
      <ellipse class="bino__glass" cx="143" cy="26" rx="15" ry="4.5"/>
      <path class="bino__glint" d="M47 25 Q52 22 60 22.5"/>
      <path class="bino__glint" d="M133 25 Q138 22 146 22.5"/>
    </svg>
  </button>

  <!-- Teleprinter, stood on the dash top to starboard. It stays put: when a signal
       comes in the lamp flashes and it prints a slip. Click the slip to read it. -->
  <div class="telex" id="telex">
    <div class="telex__feed">
      <button class="telex__slip" id="telexSlip" type="button" hidden disabled
              aria-label="Signal slip: pick it up to read it">
        <span class="telex__type" id="telexType"></span>
      </button>
    </div>
    <svg viewBox="0 0 200 150" aria-hidden="true">
      <defs>
        <linearGradient id="txEnamel" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0" stop-color="#4a5142"/>
          <stop offset="0.4" stop-color="#33382f"/>
          <stop offset="1" stop-color="#1e211c"/>
        </linearGradient>
      </defs>
      <ellipse class="tx__shadow" cx="100" cy="142" rx="96" ry="8"/>

      <path class="tx__lid" d="M34 46 L166 46 L172 64 L28 64 Z"/>
      <rect class="tx__platen" x="52" y="48" width="96" height="10" rx="5"/>
      <path class="tx__ribs" d="M54 51 L146 51 M54 54 L146 54"/>
      <circle class="tx__bezel" cx="52" cy="53" r="4"/>
      <circle class="tx__bezel" cx="148" cy="53" r="4"/>

      <path class="tx__shell" d="M22 62 L178 62 L192 132 L8 132 Z"/>
      <path class="tx__edge" d="M25 65 L175 65"/>

      <rect class="tx__plate" x="72" y="82" width="56" height="15" rx="2"/>
      <text class="tx__letter" x="100" y="93">TELEX</text>

      <circle class="tx__bezel" cx="42" cy="102" r="11"/>
      <circle class="tx__lamp" cx="42" cy="102" r="7"/>
      <circle class="tx__glint" cx="39.5" cy="99.5" r="2"/>

      <rect class="tx__button" x="143" y="93" width="36" height="18" rx="4"/>

      <rect class="tx__foot" x="14" y="130" width="26" height="8" rx="2"/>
      <rect class="tx__foot" x="160" y="130" width="26" height="8" rx="2"/>
    </svg>
  </div>

  <!-- Dash face with the working instruments -->
  <div class="dashface">
    <div class="dashface__lip" aria-hidden="true"></div>

    <svg class="dial dial--port" viewBox="0 0 130 130" role="img" aria-label="Rudder angle indicator">
      <circle class="dial__bezel" cx="65" cy="65" r="58"/>
      <circle class="dial__face" cx="65" cy="65" r="50"/>
      <path class="dial__arc" d="M25 42 A50 50 0 0 1 105 42"/>
      <path class="dial__tick" d="M65 17 L65 27 M31 31 L38 38 M99 31 L92 38 M17 65 L27 65 M113 65 L103 65"/>
      <text class="dial__side dial__side--port" x="30" y="86">P</text>
      <text class="dial__side dial__side--stbd" x="100" y="86">S</text>
      <g id="rudderNeedle">
        <path class="dial__needle" d="M65 74 L61 68 L65 24 L69 68 Z"/>
      </g>
      <circle class="dial__cap" cx="65" cy="72" r="7"/>
      <text class="dial__label" x="65" y="105">Rudder</text>
    </svg>

    <svg class="dial dial--stbd" viewBox="0 0 130 130" role="img" aria-label="Patent log">
      <circle class="dial__bezel" cx="65" cy="65" r="58"/>
      <circle class="dial__face" cx="65" cy="65" r="50"/>
      <path class="dial__tick" d="M65 17 L65 26 M113 65 L104 65 M65 113 L65 104 M17 65 L26 65 M99 31 L93 37 M99 99 L93 93 M31 99 L37 93 M31 31 L37 37"/>
      <g id="logNeedle">
        <path class="dial__needle" d="M65 70 L61 64 L65 22 L69 64 Z"/>
      </g>
      <circle class="dial__cap" cx="65" cy="65" r="7"/>
      <rect class="dial__window" x="38" y="74" width="54" height="17" rx="2"/>
      <text class="dial__counter" id="logCounter" x="65" y="87">0.00</text>
      <text class="dial__label" x="65" y="106">Log, nm</text>
    </svg>

    <p class="speedplate">Half ahead &middot; 15 knots</p>
    <p class="shoalplate" id="shoalPlate" role="status">Shoal water &middot; bear away to port</p>
  </div>

  <!-- Nearest thing to the eye: the wheel in your hands -->
  <svg class="wheel" id="wheel" viewBox="-115 -115 230 230" role="img" aria-label="Ship's wheel, drag to steer">
    <defs>
      <g id="spoke">
        <path class="wheel__spoke" d="M-5 -20 L-4 -74 L-7 -74 L-7 -96 L7 -96 L7 -74 L4 -74 L5 -20 Z"/>
        <circle class="wheel__collar" cx="0" cy="-70" r="7"/>
        <circle class="wheel__grip" cx="0" cy="-101" r="7.5"/>
      </g>
    </defs>
    <circle class="wheel__hit" cx="0" cy="0" r="112"/>
    <g id="rotor">
      <use href="#spoke" transform="rotate(0)"/>
      <use href="#spoke" transform="rotate(60)"/>
      <use href="#spoke" transform="rotate(120)"/>
      <use href="#spoke" transform="rotate(180)"/>
      <use href="#spoke" transform="rotate(240)"/>
      <use href="#spoke" transform="rotate(300)"/>
      <circle class="wheel__rim" cx="0" cy="0" r="72"/>
      <circle class="wheel__rim wheel__rim--light" cx="0" cy="0" r="69"/>
      <circle class="wheel__hub" cx="0" cy="0" r="19"/>
      <circle class="wheel__nut" cx="0" cy="0" r="6"/>
      <circle class="wheel__king" cx="0" cy="-101" r="7.5"/>
    </g>
  </svg>

  <div class="gloom" aria-hidden="true"></div>
</div>

<!-- Looking through the binoculars. Same sea, same heading, much closer. -->
<div class="glasses" id="glasses" role="dialog" aria-modal="true"
     aria-label="Looking through the binoculars" aria-hidden="true">
  <div class="glasses__optic">
    <div class="glasses__cup glasses__cup--leather" aria-hidden="true"></div>
    <div class="glasses__cup glasses__cup--brass" aria-hidden="true"></div>
    <div class="glasses__cup glasses__cup--gap" aria-hidden="true"></div>

    <div class="glasses__cup glasses__field" id="glassField">
      <div class="glasses__scene" id="glassScene">
        <div class="glasses__sky" id="glassSky"></div>
        <div class="glasses__sun" id="glassSun"></div>
        <div class="glasses__clouds" id="glassClouds"></div>
        <div class="glasses__sea" id="glassSea"><div class="swell" id="glassSwell"></div></div>
        <div class="glasses__haze" id="glassHaze"></div>
        <canvas class="surface" id="glassSurface"></canvas>
        <div class="world" id="glassWorld"></div>
        <div class="glasses__air" id="glassAir"></div>
      </div>
      <div class="glasses__lens" aria-hidden="true"></div>
      <svg class="glasses__reticle" viewBox="-100 -40 200 80" aria-hidden="true">
        <path d="M-90 0 L90 0 M0 -30 L0 30"/>
        <path d="M-80 -4 L-80 4 M-60 -4 L-60 4 M-40 -6 L-40 6 M-20 -4 L-20 4 M20 -4 L20 4 M40 -6 L40 6 M60 -4 L60 4 M80 -4 L80 4"/>
      </svg>
    </div>
  </div>

  <p class="glasses__hint" id="glassHint">Drag to look about &middot; scroll to change power &middot; click an aircraft to identify it &middot; Esc to lower</p>
  <p class="glasses__plate" id="glassPlate" aria-live="off">Bearing 000&#176; &middot; Elevation +0&#176; &middot; 7&#215;</p>

  <!-- Asked when you click an aircraft. It holds still until you answer. -->
  <div class="glasses__ask" id="glassAsk" role="group" aria-labelledby="glassQuestion" aria-hidden="true" tabindex="-1">
    <p class="glasses__question" id="glassQuestion">Is this aircraft German or Allied?</p>
    <div class="glasses__answers">
      <button class="glasses__answer" type="button" data-side="german">German</button>
      <button class="glasses__answer" type="button" data-side="allied">Allied</button>
    </div>
    <p class="glasses__verdict" id="glassVerdict" aria-live="polite"></p>
  </div>

  <button class="glasses__lower" id="glassLower" type="button">Lower glasses</button>
</div>

<!-- The slip off the teleprinter, picked up and held close enough to read -->
<div class="signal" id="signal" role="dialog" aria-modal="true"
     aria-label="Signal" aria-hidden="true">
  <pre class="signal__sheet" id="signalSheet"></pre>
  <button class="signal__back" id="signalBack" type="button">Put it down</button>
</div>

<!-- Artwork for things outside the window. Shapes here, colours in the stylesheet. -->
<template id="art-island">
  <svg class="art art--island" viewBox="0 0 240 90" preserveAspectRatio="none">
    <path d="M0 90 L0 87 L38 76 L92 28 L140 58 L188 46 L240 87 L240 90 Z"/>
  </svg>
</template>

<template id="art-lighthouse">
  <svg class="art art--lighthouse" viewBox="0 0 44 130" preserveAspectRatio="none">
    <path class="art__rock" d="M0 130 L5 114 L39 114 L44 130 Z"/>
    <path class="art__tower" d="M15 116 L17 38 L27 38 L29 116 Z"/>
    <rect class="art__band" x="16" y="62" width="12" height="16"/>
    <rect class="art__lantern" x="14" y="24" width="16" height="14" rx="2"/>
    <path class="art__cap" d="M12 24 L22 12 L32 24 Z"/>
  </svg>
</template>

<template id="art-buoy-port">
  <svg class="art art--buoy art--port" viewBox="0 0 26 78" preserveAspectRatio="none">
    <path class="art__body" d="M7 68 L6 34 L20 34 L19 68 Z"/>
    <rect class="art__mast" x="12" y="12" width="2" height="24"/>
    <rect class="art__topmark" x="6" y="4" width="14" height="10"/>
    <path class="art__wash" d="M1 70 Q13 62 25 70 Q13 77 1 70 Z"/>
  </svg>
</template>

<template id="art-buoy-starboard">
  <svg class="art art--buoy art--starboard" viewBox="0 0 26 78" preserveAspectRatio="none">
    <path class="art__body" d="M6 68 L7 36 L19 36 L20 68 Z"/>
    <rect class="art__mast" x="12" y="14" width="2" height="24"/>
    <path class="art__topmark" d="M13 2 L20 16 L6 16 Z"/>
    <path class="art__wash" d="M1 70 Q13 62 25 70 Q13 77 1 70 Z"/>
  </svg>
</template>

<template id="art-sloop">
  <svg class="art art--sloop" viewBox="0 0 64 96" preserveAspectRatio="none">
    <path class="art__main" d="M33 6 L33 70 L56 70 Z"/>
    <path class="art__jib" d="M31 10 L31 70 L12 70 Z"/>
    <path class="art__hull" d="M6 70 L60 70 L52 82 L14 82 Z"/>
  </svg>
</template>

<template id="art-freighter">
  <svg class="art art--freighter" viewBox="0 0 300 84" preserveAspectRatio="none">
    <path class="art__hull" d="M6 54 L294 54 L276 76 L24 76 Z"/>
    <rect class="art__box" x="54" y="36" width="42" height="18"/>
    <rect class="art__box" x="104" y="30" width="46" height="24"/>
    <rect class="art__box" x="158" y="38" width="38" height="16"/>
    <rect class="art__house" x="212" y="18" width="46" height="36"/>
    <rect class="art__stack" x="230" y="4" width="12" height="16"/>
  </svg>
</template>

<!-- Things up in the sky, only made out through the glasses -->
<template id="art-gull">
  <svg class="art art--gull" viewBox="0 0 40 16" preserveAspectRatio="none">
    <path d="M2 10 Q10 1 20 9 Q30 1 38 10 Q30 5 20 12 Q10 5 2 10 Z"/>
  </svg>
</template>

<!-- What an aircraft looks like from the helm: no markings, no type, just a dark shape.
     Drawn nose-up, then turned to fly right, like the sprites below. -->
<template id="art-silhouette">
  <svg class="art art--silhouette" viewBox="-150 -150 300 300" preserveAspectRatio="none">
    <g transform="rotate(90)">
      <path d="M0 -100 C7 -100 11 -92 11 -80 L11 -40 L120 -26 Q128 -24 128 -16 L128 -6 Q128 0 120 0 L11 8 L7 70 L44 78 Q50 80 50 86 L50 92 L4 96 L0 104 L-4 96 L-50 92 L-50 86 Q-50 80 -44 78 L-7 70 L-11 8 L-120 0 Q-128 0 -128 -6 L-128 -16 Q-128 -24 -120 -26 L-11 -40 L-11 -80 C-11 -92 -7 -100 0 -100 Z"/>
    </g>
  </svg>
</template>

<!-- Aircraft for WEFT spotting, seen from below. Drawn nose-up, then turned to fly right.
     Squashed a little by the <svg> box so the span foreshortens, as if seen at an angle. -->

<!-- Junkers Ju 87 "Stuka": gull wing with a kink, fixed spatted legs, chin radiator, square tail -->
<template id="art-stuka">
  <svg class="art art--plane" viewBox="-150 -150 300 300" preserveAspectRatio="none">
    <defs>
      <g id="balken">
        <path class="cross__edge" d="M-6 -15 H6 V-6 H15 V6 H6 V15 H-6 V6 H-15 V-6 H-6 Z"/>
        <path class="cross__bar"  d="M-2.5 -15 H2.5 V-2.5 H15 V2.5 H2.5 V15 H-2.5 V2.5 H-15 V-2.5 H-2.5 Z"/>
      </g>

      <!-- One half of the aircraft; mirrored for the other side -->
      <g id="ju-half">
        <path class="ju__skin" d="M12 -38 L62 -37 L130 -27 Q140 -25 140 -14 L139 2 Q138 8 131 8 L62 18 L12 20 Z"/>
        <path class="panel ju__panel" d="M62 -37 L62 18 M66 12 L134 3"/>
        <path class="ju__brake" d="M72 -31 L120 -25"/>
        <use href="#balken" x="100" y="-6"/>

        <path class="ju__skin" d="M5 84 L46 86 Q54 88 54 95 Q54 104 46 105 L5 106 Z"/>
        <path class="panel ju__panel" d="M8 98 L50 98"/>
        <path class="ju__strut" d="M7 76 L30 90"/>

        <path class="ju__leg" d="M62 -30 L62 -14"/>
        <path class="ju__spat" d="M62 -66 C68 -66 70 -52 69 -40 C68 -30 66 -24 62 -24 C58 -24 56 -30 55 -40 C54 -52 56 -66 62 -66 Z"/>
      </g>
    </defs>

    <g transform="rotate(90)">
      <use href="#ju-half"/>
      <use href="#ju-half" transform="scale(-1 1)"/>

      <path class="ju__skin" d="M0 -106 C8 -106 13 -100 14 -90 L15 -40 C15 -10 13 20 9 60 L5 108 C4 114 -4 114 -5 108 L-9 60 C-13 20 -15 -10 -15 -40 L-14 -90 C-13 -100 -8 -106 0 -106 Z"/>
      <path class="panel ju__panel" d="M-14 -62 L14 -62 M0 30 L0 104"/>
      <rect class="ju__radiator" x="-8" y="-92" width="16" height="20" rx="3"/>

      <ellipse class="ju__bomb" cx="0" cy="-18" rx="5" ry="24"/>
      <path class="ju__bomb" d="M-7 12 L7 12 L4 4 L-4 4 Z"/>

      <ellipse class="ju__spinner" cx="0" cy="-108" rx="6" ry="5"/>
      <ellipse class="airscrew" cx="0" cy="-112" rx="34" ry="2.5"/>
    </g>
  </svg>
</template>

<!-- Supermarine Spitfire Mk I: elliptical wing, gear tucked away, one radiator under the
     starboard wing, slim fuselage, rounded tail. From below, starboard is on the left (-x). -->
<template id="art-spitfire">
  <svg class="art art--plane" viewBox="-150 -150 300 300" preserveAspectRatio="none">
    <defs>
      <!-- Wing outline, no colour of its own: each side takes its paint from the <use> -->
      <path id="spit-wing" d="M10 -30 C44 -31 84 -26 104 -14 C114 -8 116 0 110 5 C96 12 60 18 10 22 Z"/>

      <g id="roundel">
        <circle class="roundel__blue"  r="11"/>
        <circle class="roundel__white" r="7"/>
        <circle class="roundel__red"   r="3.5"/>
      </g>

      <!-- Markings and panel lines for one wing; mirrored for the other -->
      <g id="spit-marks">
        <path class="panel spit__panel" d="M12 19 L56 15 M62 14 C84 10 100 4 108 -6"/>
        <ellipse class="panel spit__panel" cx="30" cy="-6" rx="11" ry="8"/>
        <use href="#roundel" x="76" y="-4"/>
        <path class="spit__skin" d="M4 72 C22 70 34 74 36 80 C37 86 30 90 4 90 Z"/>
      </g>
    </defs>

    <g transform="rotate(90)">
      <use href="#spit-wing" class="spit__wing--port"/>
      <use href="#spit-wing" class="spit__wing--stbd" transform="scale(-1 1)"/>
      <use href="#spit-marks"/>
      <use href="#spit-marks" transform="scale(-1 1)"/>

      <rect class="spit__radiator" x="-52" y="-6" width="16" height="22" rx="3"/>
      <rect class="spit__radiator" x="36" y="-8" width="10" height="14" rx="5"/>

      <path class="spit__skin" d="M0 -88 C6 -88 10 -82 11 -72 L11 -20 C11 10 9 40 6 70 L3 92 C2 96 -2 96 -3 92 L-6 70 C-9 40 -11 10 -11 -20 L-11 -72 C-10 -82 -6 -88 0 -88 Z"/>
      <path class="panel spit__panel" d="M-11 -60 L11 -60 M0 20 L0 88"/>

      <path class="spit__spinner" d="M0 -100 C4 -96 6 -90 6 -86 L-6 -86 C-6 -90 -4 -96 0 -100 Z"/>
      <ellipse class="airscrew" cx="0" cy="-88" rx="33" ry="2.4"/>

</template>

<script>
(() => {
  'use strict';

  // ---- Tuning -------------------------------------------------------------
  const WHEEL_STOP = 540;    // wheel travel each way, degrees
  const RUDDER_MAX = 35;     // rudder travel each way, degrees
  const TURN_GAIN  = 0.62;   // heading deg/sec per degree of rudder, at cruise
  const SPEED      = 7.7;    // metres per second, held constant (about 15 knots)
  const EYE        = 3.6;    // height of your eye above the water, metres
  const WORLD      = 4000;   // the sea repeats every 4 km, in both directions
  const FOV        = 68;     // degrees of bearing across the horizon layer
  const HAZE       = 4200;   // metres at which things fade out entirely
  const WAKE_NEAR  = 3.2;    // px of wave scroll per metre run, near water
  const WAKE_FAR   = 1.1;    // and for the slower, more distant band
  const NEEDLE     = 1.7;    // degrees of needle per degree of rudder

  // ---- Binoculars ---------------------------------------------------------
  const MAG_START  = 7;      // power when first raised, times the windscreen view
  const MAG_MIN    = 3;
  const MAG_MAX    = 12;
  const PITCH_MIN  = -3;     // degrees below the horizon you can look
  const PITCH_MAX  = 70;     // and above it
  const PITCH_UP   = 1.2;     // where you're looking when you first raise them
  const LOOK_KEYS  = 42;     // key panning, degrees/sec at 1x (slower at higher power)
  const SHAKE      = 0.035;  // hand tremor, degrees
  const WIND       = 0.05;   // cloud drift, degrees of bearing per second
  const CLOUDS     = 120;
  const SUN        = { bearing: 128, elev: 26, size: 10 };

  // ---- Teleprinter --------------------------------------------------------
  const TELEX_DIR    = '../Telex Machine Demo/';  // signal files and config.js
  const SIGNAL_FIRST = [8, 20];    // seconds before the first signal comes in
  const SIGNAL_GAP   = [40, 120];  // seconds after one is put down before the next
  const LINE_FEED    = 0.16;       // seconds per line as the slip feeds out

  // Sky colour by elevation, horizon to zenith
  const SKY_STOPS = [
    [0,  [220, 232, 233]],
    [5,  [195, 214, 221]],
    [22, [159, 188, 203]],
    [70, [104, 146, 170]]
  ];

  // ---- The sea room, in metres. x is east, y is north. --------------------
  // w and h are real sizes, so range alone decides how big a thing looks.
  const SCENE = [
    { art: 'buoy-port',      x:  -48, y:   210, w: 3.4, h:  11 },
    { art: 'buoy-starboard', x:   52, y:   265, w: 3.4, h:  11 },
    { art: 'buoy-port',      x:  -62, y:   760, w: 3.4, h:  11 },
    { art: 'buoy-starboard', x:   68, y:   840, w: 3.4, h:  11 },
    { art: 'sloop',          x:  250, y:   520, w:  12, h:  16 },
    { art: 'sloop',          x: -880, y:  1600, w:  12, h:  16 },
    { art: 'lighthouse',     x: -520, y:   900, w:  12, h:  42 },
    { art: 'freighter',      x: 1400, y: -1500, w: 180, h:  40 },
    { art: 'island',         x:  900, y:  1300, w: 700, h: 130 },
    { art: 'island',         x:-1500, y:  -900, w: 600, h:  90 }
  ];

  // ---- The coast ----------------------------------------------------------
  // The French shore, away to the east, running north and south out of sight.
  // It isn't part of the repeating sea, and it can't be reached: the shoals
  // hold you COAST_OFF metres off, and nothing out on the water stands on it.
  const COAST_X    = 2600;   // metres east, give or take the bays
  const COAST_OFF  = 450;    // how close the shoals let you come
  const SHOAL_WARN = 250;    // metres short of that when the plate lights
  const WOODS      = 900;    // the belt of trees behind the dunes, metres inland
  const INLAND     = 3200;   // the ridge of hills behind that
  const TOWN       = { from: 2900, to: 4700 };  // along the shore, metres north
  const SMOKE      = { y: 3900, inland: 260, height: 1100 };  // the town is burning
  const LAND_HAZE  = 16000;  // metres at which the land is lost in the haze
  const EARTH      = 2 * 7.4e6;  // twice the earth's radius, with a little refraction
  const LAND = {
    hills: [96, 118, 108],
    woods: [72, 90, 62],
    dunes: [172, 160, 120],
    grass: [118, 128, 90],
    town:  [116, 108, 100],
    beach: [226, 210, 166],
    haze:  [200, 214, 216]
  };

  // ---- Wavelets -----------------------------------------------------------
  // Drawn in bands by range, each band a lattice of small crests. Further out
  // the rows close up and the crests shrink, so the sea reads as perspective.
  const WAVE_ROW   = 15;     // px between rows where a band begins
  const WAVE_GAP   = 80;     // px between crests along a row, near to
  const WAVE_FAR   = 2600;   // metres; past this the sea is too fine to pick out
  const WAVE_SET   = 0.35;   // metres a second the crests drift down-wind
  const SKYLINE    = 0.07;   // degrees the far swell lifts the horizon, at most
  const SEA_FAR    = [76, 124, 134];   // the sea's colour at the horizon (--sea-far)
  const MIST       = [232, 240, 240];  // and the haze lying over it

  // ---- The sky, by true bearing and elevation in degrees ------------------
  // Too far off to shift as the boat moves. w and h are angular sizes.
  // Gulls wheel about their spot (loop, pace).
  const SKY = [
    { art: 'gull',     bearing:  10, elev:  5.0, w: 0.50, h: 0.20, loop: 2.2, pace: 0.35 },
    { art: 'gull',     bearing:  14, elev:  6.4, w: 0.44, h: 0.18, loop: 1.8, pace: 0.42 },
    { art: 'gull',     bearing:   7, elev:  7.1, w: 0.40, h: 0.16, loop: 2.6, pace: 0.30 },
    { art: 'gull',     bearing: 335, elev:  9.0, w: 0.42, h: 0.17, loop: 3.0, pace: 0.28 },
    { art: 'gull',     bearing: 205, elev:  4.0, w: 0.55, h: 0.22, loop: 1.6, pace: 0.50 },
    { art: 'gull',     bearing:  92, elev: 12.0, w: 0.38, h: 0.15, loop: 2.4, pace: 0.33 }
  ];

  // ---- Aircraft for WEFT spotting -----------------------------------------
  // Now and then one crosses low over the horizon. From the helm it's only a silhouette;
  // through the glasses it's a German or British aircraft. Clicking it spots it, and
  // you're asked whose it is. w and h are angular sizes.
  const AIRCRAFT = {
    stuka:    { w: 0.66, h: 0.50, side: 'german', name: 'Junkers Ju 87 “Stuka”' },
    spitfire: { w: 0.56, h: 0.43, side: 'allied', name: 'Supermarine Spitfire' }
  };
  const SIDES = { german: 'German', allied: 'Allied' };
  const PLANE_DRIFT = 0.8;         // degrees of bearing per second
  const PLANE_ELEV  = [1.8, 4.5];  // degrees above the horizon
  const PLANE_ENTER = 36;          // comes in from this far off the bow, just out of sight
  const PLANE_PASS  = 80;          // degrees it flies before it's gone
  const PLANE_GAP   = [8, 25];     // seconds of empty sky between one and the next
  const SPOT_HOLD   = 5;           // seconds it holds still once answered, to be looked at
  const SPOT_FADE   = 1.2;         // then seconds to fade; matches .is-spotted

  // ---- State --------------------------------------------------------------
  let wheelAngle = 0;
  let heading    = 0;        // degrees true
  let swung      = 0;        // total degrees turned, never wrapped, for the water
  let boatX      = 0;        // metres east
  let boatY      = -80;      // metres north, starting just short of the channel
  let run        = 0;        // metres run through the water
  let dragging   = false;
  let lastGrab   = 0;
  let ppd        = 12;       // pixels per degree, set by layout()
  let horizonW   = 0;
  let horizonH   = 0;
  let roll       = 0;        // degrees, shared by the windscreen and the glasses
  let aground    = false;    // up against the shoals
  const marks    = [];
  const skyClouds = [];      // the low clouds, as seen through the windscreen

  let glassesUp  = false;
  let lookRel    = 0;        // degrees off the bow you're looking
  let pitch      = PITCH_UP; // degrees above the horizon
  let mag        = MAG_START;
  let peering    = false;    // dragging the view about
  let peerX      = 0;
  let peerY      = 0;
  let sceneW     = 0;
  let sceneH     = 0;
  let hintTimer  = 0;
  let glassRun   = 0;        // metres made good along the line you're looking,
  let glassSlide = 0;        // and across it, so the water moves right in the glasses
  const held     = new Set();
  const glassMarks = [];
  const clouds   = [];
  const flyers   = [];
  let sun        = null;
  const sprites  = [];       // one of each aircraft type, seen through the glasses
  let silhouette = null;     // what any of them looks like from the helm
  let plane      = null;     // the flight up there now, if any
  let planeWait  = 3;        // seconds until the next one comes over

  const gl = {
    root:   document.getElementById('glasses'),
    open:   document.getElementById('binoculars'),
    lower:  document.getElementById('glassLower'),
    field:  document.getElementById('glassField'),
    scene:  document.getElementById('glassScene'),
    sky:    document.getElementById('glassSky'),
    sun:    document.getElementById('glassSun'),
    clouds: document.getElementById('glassClouds'),
    sea:    document.getElementById('glassSea'),
    swell:  document.getElementById('glassSwell'),
    haze:   document.getElementById('glassHaze'),
    world:  document.getElementById('glassWorld'),
    air:    document.getElementById('glassAir'),
    surface: surface(document.getElementById('glassSurface')),
    plate:  document.getElementById('glassPlate'),
    hint:   document.getElementById('glassHint'),
    ask:    document.getElementById('glassAsk'),
    verdict: document.getElementById('glassVerdict'),
    answers: [...document.querySelectorAll('.glasses__answer')]
  };

  const el = {
    wheel:   document.getElementById('wheel'),
    rotor:   document.getElementById('rotor'),
    horizon: document.getElementById('horizon'),
    world:   document.getElementById('world'),
    air:     document.getElementById('air'),
    swell:   document.getElementById('swell'),
    clouds:  document.getElementById('clouds'),
    surface: surface(document.getElementById('surface')),
    shoal:   document.getElementById('shoalPlate'),
    card:    document.getElementById('compassCard'),
    plate:   document.getElementById('headingPlate'),
    rudder:  document.getElementById('rudderNeedle'),
    logHand: document.getElementById('logNeedle'),
    logText: document.getElementById('logCounter')
  };

  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const norm  = d => ((d % 360) + 360) % 360;
  const DEG   = 180 / Math.PI;
  const within = ([lo, hi]) => lo + Math.random() * (hi - lo);   // seconds; between() below is ms

  const hide = thing => {
    if (thing.shown) { thing.el.style.display = 'none'; thing.shown = false; }
  };

  const arc = (a, b) => {                        // shortest signed way round
    let d = norm(b) - norm(a);
    if (d > 180) d -= 360;
    if (d < -180) d += 360;
    return d;
  };

  // Wrap a distance into the nearest copy of the repeating sea
  const wrap = v => ((v + WORLD / 2) % WORLD + WORLD) % WORLD - WORLD / 2;

  // How wide something stands in the eye, and how tall it rises from the water
  const subtendW = (size, range) => 2 * Math.atan(size / (2 * range)) * DEG;
  const subtendH = (size, range) => Math.atan(size / range) * DEG;

  // ---- Build the world ----------------------------------------------------
  // Each copy gets its own ids, so two copies of the same aircraft never share <defs>
  let copies = 0;
  const artwork = (name, className) => {
    const holder = document.createElement('div');
    holder.className = className;
    const art = document.getElementById('art-' + name).content.firstElementChild.cloneNode(true);
    const tag = '-' + (++copies);
    art.querySelectorAll('[id]').forEach(n => { n.id += tag; });
    art.querySelectorAll('use').forEach(u => u.setAttribute('href', u.getAttribute('href') + tag));
    holder.appendChild(art);
    return holder;
  };

  // The same sea goes in the windscreen and in the glasses
  function buildWorld(container, list) {
    SCENE.forEach(item => {
      const holder = artwork(item.art, 'mark');
      container.appendChild(holder);
      list.push({ el: holder, x: item.x, y: item.y, w: item.w, h: item.h, shown: true });
    });
  }

  // Cheap repeatable randomness, so the clouds are the same every visit
  function seeded(seed) {
    let s = seed;
    return () => (s = (s * 16807) % 2147483647) / 2147483647;
  }

  function buildSky() {
    const rnd = seeded(1940);
    for (let i = 0; i < CLOUDS; i++) {
      const node = document.createElement('div');
      node.className = 'cloud';
      const puffs = 5 + Math.floor(rnd() * 4);
      for (let p = 0; p < puffs; p++) {
        const puff = document.createElement('span');
        puff.style.left   = (rnd() * 70).toFixed(1) + '%';
        puff.style.top    = (rnd() * 34).toFixed(1) + '%';
        puff.style.height = (58 + rnd() * 50).toFixed(1) + '%';
        node.appendChild(puff);
      }
      gl.clouds.appendChild(node);

      const e = 1 + Math.pow(rnd(), 2.2) * 36;   // most sit low
      const far = clamp(0.3 + e / 15, 0.35, 1);  // low clouds are further off
      const w = (3 + rnd() * 8) * far;
      const cloud = {
        el: node, shown: true,
        b: rnd() * 360, e,
        w, h: w * (0.26 + rnd() * 0.18) * clamp(e / 8, 0.45, 1)
      };
      clouds.push(cloud);

      // The low ones show over the windscreen's horizon too
      if (e < 16) {
        const twin = node.cloneNode(true);
        el.clouds.appendChild(twin);
        skyClouds.push({ el: twin, shown: true, cloud });
      }
    }

    SKY.forEach((item, i) => {
      const holder = artwork(item.art, 'flyer');
      holder.style.setProperty('--flap', (0.34 + (i % 3) * 0.07) + 's');
      gl.air.appendChild(holder);
      flyers.push({ el: holder, shown: true, item, phase: i * 1.7 });
    });

    sun = { el: gl.sun, shown: true };
  }

  // From the helm every aircraft is the same dark shape; only the glasses show which it is
  function buildAircraft() {
    const far = artwork('silhouette', 'flyer');
    far.style.display = 'none';
    el.air.appendChild(far);
    silhouette = { el: far, shown: false };

    for (const [art, size] of Object.entries(AIRCRAFT)) {
      const near = artwork(art, 'flyer');
      near.style.display = 'none';
      gl.air.appendChild(near);
      sprites.push({ art, ...size, el: near, shown: false });
    }
  }

  // Graduate the compass card: a tick every 5 degrees, figures every 30
  // (in tens, as steering cards do: 3 is 030), letters at the cardinals.
  const CARD_CX = 120;
  const CARD_CY = 254;
  const SVG_NS  = 'http://www.w3.org/2000/svg';
  const CARDINAL = { 0: 'N', 90: 'E', 180: 'S', 270: 'W' };

  function buildCard() {
    const marks = document.getElementById('cardMarks');
    const svg = (tag, attrs) => {
      const node = document.createElementNS(SVG_NS, tag);
      for (const k in attrs) node.setAttribute(k, attrs[k]);
      return node;
    };

    for (let deg = 0; deg < 360; deg += 5) {
      const major = deg % 90 === 0;
      const ten   = deg % 10 === 0;
      const inner = major ? 50 : ten ? 54 : 57;
      const cls = 'card__grad' + (major ? ' card__grad--major' : ten ? ' card__grad--ten' : '');
      marks.appendChild(svg('line', {
        class: cls,
        x1: CARD_CX, y1: CARD_CY - 62, x2: CARD_CX, y2: CARD_CY - inner,
        transform: 'rotate(' + deg + ' ' + CARD_CX + ' ' + CARD_CY + ')'
      }));

      if (deg % 30 !== 0) continue;
      const letter = CARDINAL[deg];
      const label = svg('text', {
        class: letter ? 'card__letter' + (deg === 0 ? ' card__letter--north' : '') : 'card__num',
        x: CARD_CX, y: CARD_CY - (letter ? 40 : 45),
        transform: 'rotate(' + deg + ' ' + CARD_CX + ' ' + CARD_CY + ')'
      });
      label.textContent = letter || String(deg / 10);
      marks.appendChild(label);
    }
  }

  function layout() {
    horizonW = el.horizon.clientWidth;
    horizonH = el.horizon.clientHeight;
    ppd = horizonW / FOV;
    sceneW = gl.scene.clientWidth;
    sceneH = gl.scene.clientHeight;
    fitSurface(el.surface, horizonW, horizonH);
    fitSurface(gl.surface, sceneW, sceneH);
  }

  // ---- The sea surface and the coast --------------------------------------
  // One canvas in the windscreen and one in the glasses, drawn with the same
  // projection as the marks: `z` pixels per degree, the horizon at `horizonY`.

  function surface(canvas) {
    return { el: canvas, ctx: canvas.getContext('2d'), w: 0, h: 0 };
  }

  function fitSurface(s, w, h) {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    s.w = w;
    s.h = h;
    s.el.width  = Math.max(1, Math.round(w * dpr));
    s.el.height = Math.max(1, Math.round(h * dpr));
    s.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // Repeatable scatter, 0..1, from three whole numbers
  function hash(a, b, c) {
    let h = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263) ^ Math.imul(c | 0, 1274126177);
    h = Math.imul(h ^ (h >>> 13), 1103515245);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }

  // Smooth repeatable noise, 0..1, for the lie of the land
  function noise(t, seed) {
    const i = Math.floor(t);
    const f = t - i;
    const s = f * f * (3 - 2 * f);
    return hash(i, seed, 0) * (1 - s) + hash(i + 1, seed, 0) * s;
  }

  // Where the shore runs, metres east, at `y` metres north
  const coastX = y => COAST_X + 160 * Math.sin(y / 1100) + 70 * Math.sin(y / 430 + 2);

  // How much of the town stands at `y`, 0..1, feathered at the ends
  const townAt = y => clamp(Math.min(y - TOWN.from, TOWN.to - y) / 250, 0, 1);

  // Height of the dunes, or the town's roofs, standing on the shore
  function shoreH(y, town) {
    const dune = 9 + 10 * noise(y / 260, 1) + 4 * noise(y / 60, 2);
    if (town <= 0) return dune;
    const lot = Math.floor(y / 26);
    let roof = 6 + 14 * Math.pow(hash(lot, 3, 0), 1.5);
    if (hash(lot, 4, 0) > 0.965) roof = 30 + 14 * hash(lot, 5, 0);   // belfries, cranes
    return dune + (Math.max(dune, roof) - dune) * town;
  }

  const hillH  = y => 55 + 95 * noise(y / 1700, 5) + 25 * noise(y / 450, 6);
  const woodsH = y => 16 + 10 * noise(y / 40, 7) + 5 * noise(y / 11, 8);   // lumpy, like treetops

  // Range along a bearing to the shore, or to the hills `off` metres inland
  function reach(sinB, cosB, off) {
    let d = (COAST_X + off - boatX) / sinB;
    if (sinB > 0.3) {                            // steep enough for the bays to settle
      for (let k = 0; k < 3; k++) d = (coastX(boatY + d * cosB) + off - boatX) / sinB;
    }
    return Math.min(d, 60000);
  }

  // Land colour at range, going over to the haze
  function tint(rgb, d, alpha) {
    const t = Math.pow(clamp(d / LAND_HAZE, 0, 1), 0.6);
    const c = rgb.map((v, k) => Math.round(v + (LAND.haze[k] - v) * t));
    return alpha === undefined ? 'rgb(' + c + ')' : 'rgba(' + c + ',' + alpha.toFixed(3) + ')';
  }

  const mix = (a, b, t) => a.map((v, k) => v + (b[k] - v) * t);

  function drawSurface(s, v) {
    s.ctx.clearRect(0, 0, s.w, s.h);
    drawSkyline(s.ctx, v);
    drawWaves(s.ctx, v);
    drawCoast(s.ctx, v);
  }

  // The horizon isn't a ruled line: the far swell lifts and settles along it.
  // Tied to true bearing, so it slides by as you turn; in degrees, so the
  // glasses show the same swell, only bigger.
  function drawSkyline(ctx, v) {
    const t = stillness.matches ? 0 : clock;
    const STEP = 4;
    ctx.beginPath();
    ctx.moveTo(-STEP, v.horizonY + 1);
    for (let x = -STEP; x <= v.w + STEP; x += STEP) {
      const b = v.lookU + (x - v.cx) / v.z;
      const lift = 1 +
        0.55 * Math.sin(b * 0.9 + t * 0.45) +
        0.30 * Math.sin(b * 2.3 - t * 0.7 + 1.3) +
        0.15 * Math.sin(b * 5.1 + t * 1.1 + 4);
      ctx.lineTo(x, v.horizonY - lift * SKYLINE * v.z);
    }
    ctx.lineTo(v.w + STEP, v.horizonY + 1);
    ctx.closePath();
    ctx.fillStyle = 'rgb(' + mix(SEA_FAR, MIST, v.mist).map(Math.round) + ')';
    ctx.fill();
  }

  // Small crests, catching the light, rolling towards you as she makes way.
  // Rows lie across the line of sight; each band of range has its own lattice,
  // and the bands overlap a little so one hands over to the next unseen.
  function drawWaves(ctx, v) {
    const f = v.z * DEG;                         // pixels per radian
    const fq = Math.pow(2, Math.round(Math.log2(f)));   // zoom in steps so the pattern holds
    const dipMax = (v.h - v.horizonY) / v.z;
    if (dipMax <= 0) return;
    const uNear = EYE / Math.tan(Math.min(dipMax, 60) / DEG);
    const still = stillness.matches;
    const lookRad = v.lookU / DEG;
    const spanRad = v.span / DEG;
    const paths = new Map();
    const path = key => {
      let p = paths.get(key);
      if (!p) paths.set(key, p = { light: new Path2D(), dark: new Path2D() });
      return p;
    };
    const foam = new Path2D();

    for (let b = 0; b < 13; b++) {
      const u0 = Math.pow(2, b);                 // this band starts u0 metres off
      const u1 = u0 * 2;
      const uEnd = u1 * 1.25;
      if (uEnd < uNear || u0 > WAVE_FAR) continue;

      const du = WAVE_ROW * u0 * u0 / (EYE * fq);                     // metres between rows
      const dA = WAVE_GAP / fq * Math.sqrt(16 * fq / 1024 / u0);      // radians between crests
      const nLo = Math.ceil((Math.max(u0, uNear * 0.9) + v.travel) / du);
      const nHi = Math.floor((Math.min(uEnd, WAVE_FAR) + v.travel) / du);

      for (let n = nLo; n <= nHi; n++) {
        const uRow = n * du - v.travel;
        let fade = 1;
        if (b > 0 && uRow < u0 * 1.25) fade = (uRow - u0) / (u0 * 0.25);
        if (uRow > u1) fade = Math.min(fade, (uEnd - uRow) / (u1 * 0.25));
        if (fade <= 0.02) continue;

        const far = clamp(1.15 - Math.log2(uRow / 20) / 7, 0.15, 1);
        const drift = ((still ? 0 : WAVE_SET * clock) + v.slide) / uRow;
        const jLo = Math.floor((lookRad - spanRad - drift) / dA);
        const jHi = Math.ceil((lookRad + spanRad - drift) / dA);

        for (let j = jLo; j <= jHi; j++) {
          const r1 = hash(b, n, j * 6);
          const r2 = hash(b, n, j * 6 + 1);
          const r3 = hash(b, n, j * 6 + 2);
          const r4 = hash(b, n, j * 6 + 3);

          const ang = (j + (r1 - 0.5) * 0.8) * dA + drift;            // radians, true
          const u = uRow + (r2 - 0.5) * 0.9 * du;
          const x = v.cx + (ang - lookRad) * f;
          const y = v.horizonY + subtendH(EYE, u) * v.z;
          if (y > v.h + 4) continue;

          const W = clamp(dA * f * (0.3 + 0.35 * r3) * (u0 * 1.1 / u), 1.5, 90);
          const A = Math.min(Math.max(0.5, W * 0.9 * EYE / u), W * 0.25);

          const swell = still ? 0.8 : 0.55 + 0.45 * Math.sin(clock * (0.9 + 1.3 * r4) + r1 * 40);
          const sun = Math.exp(-Math.pow(arc(SUN.bearing, ang * DEG) / 9, 2));
          const alpha = Math.min(1, 0.55 * far * fade * swell * swell * (1 + 1.6 * sun));
          const level = Math.min(5, Math.floor(alpha * 6));
          if (level < 1) continue;

          const p = path(level * 2 + (W > 24 ? 1 : 0));
          p.light.moveTo(x - W / 2, y);
          p.light.quadraticCurveTo(x, y - A * 2, x + W / 2, y);
          if (W > 8) {                           // a trough under it, where there's room to see one
            p.dark.moveTo(x - W * 0.4, y + A + 0.6);
            p.dark.quadraticCurveTo(x, y + A * 0.2, x + W * 0.4, y + A + 0.6);
          }

          // Now and then one breaks: a fleck of white
          if (r3 < 0.05 && u < 300 && swell > 0.9) {
            foam.moveTo(x + W * 0.3, y - A);
            foam.ellipse(x, y - A, W * 0.3, Math.max(0.7, A * 0.9), 0, 0, Math.PI * 2);
          }
        }
      }
    }

    for (const [key, p] of paths) {
      const a = ((key >> 1) + 0.5) / 6;
      ctx.lineWidth = key & 1 ? 1.8 : 1.1;
      ctx.strokeStyle = 'rgba(12, 40, 50, ' + (a * 0.5).toFixed(3) + ')';
      ctx.stroke(p.dark);
      ctx.strokeStyle = 'rgba(236, 246, 246, ' + a.toFixed(3) + ')';
      ctx.stroke(p.light);
    }
    ctx.fillStyle = 'rgba(245, 250, 250, 0.75)';
    ctx.fill(foam);
  }

  // The coast, sampled across the view a few pixels at a time: hills furthest
  // back, the smoke over the town, the woods, then dunes and roofs, the beach
  // and the surf.
  function drawCoast(ctx, v) {
    const STEP = 3;
    const stretches = [];
    let open = null;

    for (let x = -STEP; x <= v.w + STEP; x += STEP) {
      const b = (v.look + (x - v.cx) / v.z) / DEG;
      const sinB = Math.sin(b);
      const cosB = Math.cos(b);
      if (sinB < 0.005) { open = null; continue; }  // not looking towards the land

      const d  = reach(sinB, cosB, 0);
      const dW = reach(sinB, cosB, WOODS);
      const d2 = reach(sinB, cosB, INLAND);
      const y  = boatY + d * cosB;
      const town = townAt(y);
      const water = v.horizonY + subtendH(EYE, d) * v.z;
      // Far along the shore the land sinks over the curve of the earth,
      // so the coast tapers away into the horizon rather than stopping dead.
      const above = (h, r) => subtendH(Math.max(0, h - r * r / EARTH), r) * v.z;
      const standing = (h, r) => v.horizonY + subtendH(EYE, r) * v.z - above(h, r);
      const col = {
        x, d, dW, d2, town, water,
        shore: water - above(shoreH(y, town), d),
        beach: water - above(2.4, d),
        woods: standing(woodsH(boatY + dW * cosB), dW),
        hill:  standing(hillH(boatY + d2 * cosB), d2)
      };
      if (!open) stretches.push(open = []);
      open.push(col);
    }

    const band = (cols, top, bottom, fill) => {
      ctx.beginPath();
      ctx.moveTo(cols[0].x, top(cols[0]));
      for (let i = 1; i < cols.length; i++) ctx.lineTo(cols[i].x, top(cols[i]));
      for (let i = cols.length - 1; i >= 0; i--) ctx.lineTo(cols[i].x, bottom(cols[i]));
      ctx.closePath();
      ctx.fillStyle = fill;
      ctx.fill();
    };

    const edge = (cols, at, stroke, width) => {
      ctx.beginPath();
      ctx.moveTo(cols[0].x, at(cols[0]));
      for (let i = 1; i < cols.length; i++) ctx.lineTo(cols[i].x, at(cols[i]));
      ctx.strokeStyle = stroke;
      ctx.lineWidth = width;
      ctx.stroke();
    };

    // Colours change slowly with range, so a stop every few columns will do
    const across = (cols, colour) => {
      const x0 = cols[0].x;
      const x1 = Math.max(cols[cols.length - 1].x, x0 + 1);
      const g = ctx.createLinearGradient(x0, 0, x1, 0);
      for (let i = 0; i < cols.length; i += 6) g.addColorStop((cols[i].x - x0) / (x1 - x0), colour(cols[i]));
      g.addColorStop(1, colour(cols[cols.length - 1]));
      return g;
    };

    for (const cols of stretches) {
      if (cols.length < 2) continue;
      band(cols, c => c.hill, c => c.water, across(cols, c => tint(LAND.hills, c.d2)));
    }

    drawSmoke(ctx, v);

    for (const cols of stretches) {
      if (cols.length < 2) continue;
      band(cols, c => c.woods, c => c.water, across(cols, c => tint(LAND.woods, c.dW)));
      band(cols, c => c.shore, c => c.water,
        across(cols, c => tint(mix(LAND.dunes, LAND.town, c.town), c.d)));

      // Dune faces darken towards their feet, where the light doesn't reach
      let top = Infinity, foot = -Infinity;
      for (const c of cols) { top = Math.min(top, c.shore); foot = Math.max(foot, c.water); }
      if (foot - top > 3) {
        const shade = ctx.createLinearGradient(0, top, 0, foot);
        shade.addColorStop(0, 'rgba(40, 34, 20, 0)');
        shade.addColorStop(1, 'rgba(40, 34, 20, 0.22)');
        band(cols, c => c.shore, c => c.water, shade);
      }
      edge(cols, c => c.shore, across(cols, c => tint(mix(LAND.grass, LAND.town, c.town), c.d)), 1.4);
      band(cols, c => c.beach, c => c.water, across(cols, c => tint(LAND.beach, c.d)));
      edge(cols, c => c.water,
        across(cols, c => 'rgba(242, 248, 248, ' + (0.85 * (1 - clamp(c.d / 9000, 0, 1))).toFixed(3) + ')'), 1.2);
    }
  }

  // Smoke from the town, leaning away down-wind over the water
  function drawSmoke(ctx, v) {
    const baseX = coastX(SMOKE.y) + SMOKE.inland;
    const PUFFS = 16;
    for (let i = PUFFS - 1; i >= 0; i--) {
      const t = i / (PUFFS - 1);
      const up = t * SMOKE.height;
      const px = baseX - up * 0.9 - boatX;
      const py = SMOKE.y - up * 0.3 - boatY;
      const range = Math.hypot(px, py);
      const rel = arc(v.look, Math.atan2(px, py) * DEG);
      const r = subtendW(70 + up * 0.5, range) * v.z * (1 + 0.08 * Math.sin(clock * 0.3 + i));
      if (Math.abs(rel) * v.z > v.w / 2 + r) continue;

      const x = v.cx + rel * v.z;
      const y = v.horizonY + (subtendH(EYE, range) - subtendH(up, range)) * v.z;
      const a = 0.45 * (1 - t * 0.7) * (1 - 0.8 * clamp(range / LAND_HAZE, 0, 1));
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, 'rgba(52, 48, 46, ' + a.toFixed(3) + ')');
      g.addColorStop(0.6, 'rgba(70, 66, 64, ' + (a * 0.55).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(90, 88, 86, 0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---- Steering: pointer only ---------------------------------------------
  function grabAngle(ev) {
    const box = el.wheel.getBoundingClientRect();
    const x = ev.clientX - (box.left + box.width / 2);
    const y = ev.clientY - (box.top + box.height / 2);
    return Math.atan2(y, x) * DEG;
  }

  el.wheel.addEventListener('pointerdown', ev => {
    dragging = true;
    lastGrab = grabAngle(ev);
    el.wheel.setPointerCapture(ev.pointerId);
    el.wheel.classList.add('is-held');
  });

  el.wheel.addEventListener('pointermove', ev => {
    if (!dragging) return;
    const now = grabAngle(ev);
    let step = now - lastGrab;
    if (step > 180) step -= 360;                 // unwrap across the +/-180 seam
    if (step < -180) step += 360;
    wheelAngle = clamp(wheelAngle + step, -WHEEL_STOP, WHEEL_STOP);
    lastGrab = now;
  });

  const release = ev => {
    if (!dragging) return;
    dragging = false;
    el.wheel.classList.remove('is-held');
    if (ev.pointerId !== undefined && el.wheel.hasPointerCapture(ev.pointerId)) {
      el.wheel.releasePointerCapture(ev.pointerId);
    }
  };
  el.wheel.addEventListener('pointerup', release);
  el.wheel.addEventListener('pointercancel', release);

  // ---- Loop ---------------------------------------------------------------
  const stillness = window.matchMedia('(prefers-reduced-motion: reduce)');
  let last = performance.now();
  let clock = 0;

  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    clock += dt;

    const rudder = clamp(wheelAngle / (WHEEL_STOP / RUDDER_MAX), -RUDDER_MAX, RUDDER_MAX);
    const turn = rudder * TURN_GAIN * dt;
    heading = norm(heading + turn);
    swung  += turn;

    // She never stops: always a step forward along the current heading.
    const rad = heading / DEG;
    boatX += Math.sin(rad) * SPEED * dt;
    boatY += Math.cos(rad) * SPEED * dt;
    run   += SPEED * dt;

    // The shoals off the French coast: she slides along them and gets no closer
    const limit = coastX(boatY) - COAST_OFF;
    if (boatX > limit) boatX = limit;
    const warned = boatX > limit - SHOAL_WARN;
    if (warned !== aground) {
      aground = warned;
      el.shoal.classList.toggle('is-shown', warned);
    }

    for (const c of clouds) c.b = norm(c.b + WIND * dt);
    flyAircraft(dt);

    flyAircraft(dt);
    drawWorld();
    drawStation(rudder);
    if (glassesUp) drawGlasses(dt);
    requestAnimationFrame(frame);
  }

  // Put each mark where it stands from the boat, looking along `look`.
  // `scale` is pixels per degree; `edge` is how far off-centre is still in view.
  function placeMarks(list, look, scale, centre, waterline, edge) {
    for (const m of list) {
      let dx = wrap(m.x - boatX);
      const dy = wrap(m.y - boatY);
      if (boatX + dx > coastX(boatY + dy) - 60) dx -= WORLD;   // never on the land: the copy out to sea
      const range = Math.max(Math.hypot(dx, dy), 12);
      const rel = arc(look, Math.atan2(dx, dy) * DEG);
      const angW = Math.min(subtendW(m.w, range), 150);

      if (Math.abs(rel) > edge + angW / 2 || range > HAZE) {
        if (m.shown) { m.el.style.display = 'none'; m.shown = false; }
        continue;
      }
      if (!m.shown) { m.el.style.display = 'block'; m.shown = true; }

      const angH = Math.min(subtendH(m.h, range), 70);
      const dip  = subtendH(EYE, range);          // how far below the horizon it sits

      m.el.style.left   = (centre + rel * scale) + 'px';
      m.el.style.width  = (angW * scale) + 'px';
      m.el.style.height = (angH * scale) + 'px';
      m.el.style.bottom = (waterline - dip * scale) + 'px';
      m.el.style.opacity = clamp(1.12 - range / HAZE, 0.08, 1);
      m.el.style.zIndex = Math.round(clamp(HAZE - range, 0, HAZE) / 4);
    }
  }

  // Hang something on the sky by true bearing and elevation, seen along `look`.
  // `scale` is pixels per degree; `horizonY` is the horizon, down from the top.
  function hang(thing, look, b, e, w, h, scale, cx, horizonY, span, height) {
    const rel = arc(look, b);
    const y = horizonY - e * scale;
    if (Math.abs(rel) > span + w / 2 || y < -h * scale || y > height + h * scale) {
      hide(thing);
      return;
    }
    if (!thing.shown) { thing.el.style.display = 'block'; thing.shown = true; }
    thing.el.style.left   = (cx + rel * scale) + 'px';
    thing.el.style.top    = y + 'px';
    thing.el.style.width  = (w * scale) + 'px';
    thing.el.style.height = (h * scale) + 'px';
  }

  function drawWorld() {
    const cx = horizonW / 2;
    const horizonY = horizonH * 0.54;           // from the top of the layer
    placeMarks(marks, heading, ppd, cx, horizonH - horizonY, FOV / 2 + 4);

    for (const s of skyClouds) {
      const c = s.cloud;
      const rel = arc(heading, c.b);
      const y = horizonY - c.e * ppd;
      if (Math.abs(rel) > FOV / 2 + c.w / 2 || y < -c.h * ppd) {
        if (s.shown) { s.el.style.display = 'none'; s.shown = false; }
        continue;
      }
      if (!s.shown) { s.el.style.display = 'block'; s.shown = true; }
      s.el.style.left   = (cx + rel * ppd) + 'px';
      s.el.style.top    = y + 'px';
      s.el.style.width  = (c.w * ppd) + 'px';
      s.el.style.height = (c.h * ppd) + 'px';
    }

    if (plane) {
      hang(silhouette, heading, plane.b, plane.e, plane.type.w, plane.type.h,
           ppd, cx, horizonY, FOV / 2, horizonH);
    }

    // Hidden behind the glasses when they're up, so spare the drawing
    if (!glassesUp) {
      drawSurface(el.surface, {
        w: horizonW, h: horizonH, cx, horizonY, z: ppd, look: heading,
        lookU: swung, span: FOV / 2 + 4, travel: run, slide: 0, mist: 0.24
      });
    }

    if (plane) {
      hang(silhouette, heading, plane.b, plane.e, plane.type.w, plane.type.h,
           ppd, horizonW / 2, horizonH * 0.54, FOV / 2, horizonH);
    }

    // Water: slides sideways as you turn, and towards you as you make way.
    // Unwrapped, so the pattern doesn't jump when you cross north.
    const side = -swung * ppd;
    el.swell.style.backgroundPosition =
      (side * 0.35).toFixed(1) + 'px ' + ((run * WAKE_NEAR) % 4000).toFixed(1) + 'px, ' +
      (side * 0.18).toFixed(1) + 'px ' + ((run * WAKE_FAR) % 4000).toFixed(1) + 'px';

    if (stillness.matches) {
      roll = 0;
      el.horizon.style.transform = 'none';
    } else {
      roll = Math.sin(clock * 0.62) * 0.75 + Math.sin(clock * 1.43) * 0.3;
      const heave = Math.sin(clock * 0.47) * 5;
      el.horizon.style.transform =
        'translateY(' + heave.toFixed(1) + 'px) rotate(' + roll.toFixed(2) + 'deg)';
    }
  }

  // ---- Binoculars ---------------------------------------------------------
  function skyAt(e) {
    e = clamp(e, 0, SKY_STOPS[SKY_STOPS.length - 1][0]);
    let i = 1;
    while (i < SKY_STOPS.length - 1 && SKY_STOPS[i][0] < e) i++;
    const [e0, c0] = SKY_STOPS[i - 1];
    const [e1, c1] = SKY_STOPS[i];
    const t = (e - e0) / (e1 - e0);
    return 'rgb(' + c0.map((c, k) => Math.round(c + (c1[k] - c) * t)).join(',') + ')';
  }

  function drawGlasses(dt) {
    const rate = LOOK_KEYS / mag * dt;
    if (held.has('left'))  lookRel -= rate;
    if (held.has('right')) lookRel += rate;
    if (held.has('up'))    pitch   += rate;
    if (held.has('down'))  pitch   -= rate;
    lookRel = arc(0, lookRel);
    pitch   = clamp(pitch, PITCH_MIN, PITCH_MAX);

    const z = ppd * mag;                         // pixels per degree through the glass
    const cx = sceneW / 2;
    const cy = sceneH / 2;
    const look = norm(heading + lookRel);
    const horizonY = cy + pitch * z;             // from the top of the scene
    const spanX = cx / z + 1;
    const eTop = pitch + cy / z;
    const eLow = Math.max(0, pitch - cy / z);
    const skyline = clamp(horizonY, 0, sceneH);

    gl.sky.style.height = skyline + 'px';
    gl.sky.style.background = 'linear-gradient(180deg,' +
      skyAt(eTop) + ',' + skyAt((eTop + eLow) / 2) + ',' + skyAt(eLow) + ')';
    gl.sea.style.top = skyline + 'px';
    gl.haze.style.top = horizonY + 'px';
    gl.haze.style.height = (1.4 * z) + 'px';

    const side = -(swung + lookRel) * z;
    gl.swell.style.backgroundPosition =
      (side * 0.35).toFixed(1) + 'px ' + ((run * WAKE_NEAR * mag) % 4000).toFixed(1) + 'px, ' +
      (side * 0.18).toFixed(1) + 'px ' + ((run * WAKE_FAR * mag) % 4000).toFixed(1) + 'px';

    // Anything hung on the sky by bearing and elevation
    const place = (thing, b, e, w, h) => hang(thing, look, b, e, w, h, z, cx, horizonY, spanX, sceneH);

    place(sun, SUN.bearing, SUN.elev, SUN.size, SUN.size);

    for (const c of clouds) place(c, c.b, c.e, c.w, c.h);

    for (const f of flyers) {
      const it = f.item;
      const t = clock * it.pace + f.phase;
      place(f, it.bearing + Math.cos(t) * it.loop, it.elev + Math.sin(t) * it.loop * 0.3, it.w, it.h);
    }

    // The silhouette from the helm, near enough now to see what it is
    if (plane) place(plane.type, plane.b, plane.e, plane.type.w, plane.type.h);

    placeMarks(glassMarks, look, z, cx, sceneH - horizonY, spanX + 4);

    glassRun   += SPEED * dt * Math.cos(lookRel / DEG);
    glassSlide += SPEED * dt * Math.sin(lookRel / DEG);
    drawSurface(gl.surface, {
      w: sceneW, h: sceneH, cx, horizonY, z, look,
      lookU: swung + lookRel, span: spanX + 2, travel: glassRun, slide: glassSlide, mist: 0.7
    });

    // Held in the hand on a moving deck: a little tremor, and the boat's roll
    if (stillness.matches) {
      gl.scene.style.transform = 'none';
    } else {
      const sx = (Math.sin(clock * 1.7) * 0.6 + Math.sin(clock * 2.9) * 0.4) * SHAKE * z;
      const sy = (Math.sin(clock * 1.3) * 0.6 + Math.sin(clock * 3.1) * 0.4) * SHAKE * z +
                 Math.sin(clock * 0.47) * 0.15 * z;
      gl.scene.style.transform =
        'translate(' + sx.toFixed(1) + 'px,' + sy.toFixed(1) + 'px) rotate(' + roll.toFixed(2) + 'deg)';
    }

    const elev = Math.round(pitch);
    gl.plate.textContent =
      'Bearing ' + String(Math.round(look) % 360).padStart(3, '0') + '° · ' +
      'Elevation ' + (elev >= 0 ? '+' : '−') + Math.abs(elev) + '° · ' +
      mag.toFixed(mag < 10 ? 1 : 0).replace(/\.0$/, '') + '×';
  }

  // ---- Aircraft ------------------------------------------------------------
  // Send one over, German or British at random, in from just out of sight to one side.
  // It crosses ahead of the bow low over the horizon, where you can see it from the helm.
  function launchAircraft() {
    const type = sprites[Math.floor(Math.random() * sprites.length)];
    const side = Math.random() < 0.5 ? -1 : 1;
    plane = {
      type,
      b: norm(heading + side * PLANE_ENTER),
      e: within(PLANE_ELEV),
      dir: -side,
      flown: 0,
      spotted: false,
      asking: false,
      hold: 0,
      fade: 0
    };

    // Turned about rather than mirrored, so it's still the underside you see
    const turn = plane.dir < 0 ? 'rotate(180deg)' : '';
    silhouette.el.firstElementChild.style.transform = turn;
    type.el.firstElementChild.style.transform = turn;
    type.el.classList.add('is-target');

    // For the rest of the game to read: which aircraft is up there now
    gl.root.dataset.aircraft = type.art;
  }

  // Clicked on through the glasses: it holds still while you're asked whose it is
  function spotAircraft() {
    plane.spotted = true;
    plane.asking = true;
    plane.hold = SPOT_HOLD;
    plane.fade = SPOT_FADE;
    plane.type.el.classList.remove('is-target');
    gl.root.dispatchEvent(new CustomEvent('aircraftspotted', {
      bubbles: true,
      detail: { aircraft: plane.type.art }
    }));
    askSide();
  }

  function askSide() {
    gl.hint.classList.remove('is-shown');
    gl.verdict.textContent = '';
    gl.ask.classList.remove('is-answered', 'is-right', 'is-wrong');
    for (const b of gl.answers) { b.disabled = false; b.classList.remove('is-chosen'); }
    gl.ask.classList.add('is-shown');
    gl.ask.setAttribute('aria-hidden', 'false');
    gl.ask.focus({ preventScroll: true });       // the question, not an answer, so neither looks picked
  }

  // Answered: say whether it was right, then let it hold a moment and fade
  function answerSide(button) {
    if (!plane || !plane.asking) return;
    plane.asking = false;
    const { art, side, name } = plane.type;
    const answer = button.dataset.side;
    const correct = answer === side;

    for (const b of gl.answers) b.disabled = true;
    button.classList.add('is-chosen');
    gl.verdict.textContent = (correct ? 'Correct: ' : 'Not quite: ') +
      'that’s a ' + name + ', ' + SIDES[side] + '.';
    gl.ask.classList.add('is-answered', correct ? 'is-right' : 'is-wrong');
    gl.lower.focus({ preventScroll: true });

    // For the rest of the game to read: what was up there, and what you called it
    gl.root.dispatchEvent(new CustomEvent('aircraftidentified', {
      bubbles: true,
      detail: { aircraft: art, side, answer, correct }
    }));
  }

  function closeAsk() {
    gl.ask.classList.remove('is-shown');
    gl.ask.setAttribute('aria-hidden', 'true');
  }

  // Glasses lowered before answering: the aircraft carries on, still to be spotted
  function unspotAircraft() {
    plane.spotted = false;
    plane.asking = false;
    plane.type.el.classList.add('is-target');
    closeAsk();
  }

  for (const b of gl.answers) b.addEventListener('click', () => answerSide(b));

  function retireAircraft() {
    closeAsk();
    for (const thing of [silhouette, plane.type]) {
      hide(thing);
      thing.el.classList.remove('is-target', 'is-spotted');
    }
    plane = null;
    planeWait = within(PLANE_GAP);
    delete gl.root.dataset.aircraft;
  }

  // Flies whether or not the glasses are up. Once it's spotted or out of sight,
  // a while later another comes over.
  function flyAircraft(dt) {
    if (!plane) {
      planeWait -= dt;
      if (planeWait <= 0) launchAircraft();
      return;
    }
    if (plane.asking) return;                    // held still until you answer
    if (plane.spotted && plane.hold > 0) {
      plane.hold -= dt;
      if (plane.hold <= 0) {
        silhouette.el.classList.add('is-spotted');
        plane.type.el.classList.add('is-spotted');
      }
      return;
    }
    plane.b = norm(plane.b + PLANE_DRIFT * plane.dir * dt);
    plane.flown += PLANE_DRIFT * dt;
    if (plane.spotted) plane.fade -= dt;
    if ((plane.spotted && plane.fade <= 0) || plane.flown > PLANE_PASS) retireAircraft();
  }

  const HINT = gl.hint.textContent;
  function showHint(text, ms) {
    gl.hint.textContent = text;
    gl.hint.classList.add('is-shown');
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => gl.hint.classList.remove('is-shown'), ms);
  }

  function raiseGlasses() {
    if (glassesUp) return;
    glassesUp = true;
    lookRel = 0;
    pitch = PITCH_UP;
    gl.root.classList.add('is-up');
    gl.root.setAttribute('aria-hidden', 'false');
    layout();
    showHint(HINT, 4500);
    gl.lower.focus({ preventScroll: true });
  }

  function lowerGlasses() {
    if (!glassesUp) return;
    glassesUp = false;
    if (plane && plane.asking) unspotAircraft();
    peering = false;
    held.clear();
    gl.root.classList.remove('is-up', 'is-peering');
    gl.root.setAttribute('aria-hidden', 'true');
    gl.open.focus({ preventScroll: true });
  }

  gl.open.addEventListener('click', raiseGlasses);
  gl.lower.addEventListener('click', lowerGlasses);

  // Point and drag: grab the view and pull it about. Click on the aircraft to spot it.
  gl.field.addEventListener('pointerdown', ev => {
    if (plane && !plane.spotted && plane.type.el.contains(ev.target)) {
      spotAircraft();
      return;
    }
    peering = true;
    peerX = ev.clientX;
    peerY = ev.clientY;
    gl.field.setPointerCapture(ev.pointerId);
    gl.root.classList.add('is-peering');
  });

  gl.field.addEventListener('pointermove', ev => {
    if (!peering) return;
    const z = ppd * mag;
    lookRel -= (ev.clientX - peerX) / z;
    pitch   += (ev.clientY - peerY) / z;
    peerX = ev.clientX;
    peerY = ev.clientY;
  });

  const stopPeering = ev => {
    if (!peering) return;
    peering = false;
    gl.root.classList.remove('is-peering');
    if (gl.field.hasPointerCapture(ev.pointerId)) gl.field.releasePointerCapture(ev.pointerId);
  };
  gl.field.addEventListener('pointerup', stopPeering);
  gl.field.addEventListener('pointercancel', stopPeering);

  // Scroll to change power
  gl.field.addEventListener('wheel', ev => {
    ev.preventDefault();
    mag = clamp(mag * (ev.deltaY < 0 ? 1.12 : 1 / 1.12), MAG_MIN, MAG_MAX);
  }, { passive: false });

  const KEYS = {
    ArrowLeft: 'left', a: 'left', A: 'left',
    ArrowRight: 'right', d: 'right', D: 'right',
    ArrowUp: 'up', w: 'up', W: 'up',
    ArrowDown: 'down', s: 'down', S: 'down'
  };

  window.addEventListener('keydown', ev => {
    if (!glassesUp) return;
    if (ev.key === 'Escape') { lowerGlasses(); return; }
    if (ev.key === '+' || ev.key === '=') mag = clamp(mag * 1.12, MAG_MIN, MAG_MAX);
    if (ev.key === '-' || ev.key === '_') mag = clamp(mag / 1.12, MAG_MIN, MAG_MAX);
    if (KEYS[ev.key]) { held.add(KEYS[ev.key]); ev.preventDefault(); }
  });
  window.addEventListener('keyup', ev => { if (KEYS[ev.key]) held.delete(KEYS[ev.key]); });
  window.addEventListener('blur', () => held.clear());

  function drawStation(rudder) {
    el.rotor.setAttribute('transform', 'rotate(' + wheelAngle.toFixed(2) + ')');

    // A magnetic card stays put while the boat turns under it.
    el.card.setAttribute('transform', 'rotate(' + (-heading).toFixed(2) + ' 120 254)');
    el.plate.textContent = String(Math.round(heading) % 360).padStart(3, '0') + '\u00B0';

    el.rudder.setAttribute('transform',
      'rotate(' + (rudder * NEEDLE).toFixed(2) + ' 65 72)');

    const miles = run / 1852;
    el.logHand.setAttribute('transform',
      'rotate(' + ((miles % 1) * 360).toFixed(1) + ' 65 65)');
    el.logText.textContent = miles.toFixed(2);
  }

  // ---- Teleprinter --------------------------------------------------------
  // The machine never moves. Every so often a signal comes in: the lamp
  // flashes and a slip feeds out, too small to read from the wheel. Click
  // the slip to pick it up; it grows out of the machine to reading size.
  // Signals are the files in ../Telex Machine Demo/signals, read the same way.
  const tx = {
    root:  document.getElementById('telex'),
    slip:  document.getElementById('telexSlip'),
    type:  document.getElementById('telexType'),
    view:  document.getElementById('signal'),
    sheet: document.getElementById('signalSheet'),
    back:  document.getElementById('signalBack')
  };
  const signals   = [];
  let lastSignal  = null;      // so the random pick doesn't repeat itself
  let printed     = '';        // the text on the slip in the machine
  let unread      = false;     // lamp stays on until it's picked up
  let reading     = false;
  let signalTimer = 0;

  // A signal file is a header block, a --- rule, then the message.
  // Unknown headers are kept under lower_snake_case keys, as in telex.js.
  function parseSignal(text) {
    const lines = String(text).replace(/\r\n?/g, '\n').split('\n');
    const sig = {};
    const body = [];
    let inHeader = true;
    for (const line of lines) {
      if (inHeader) {
        if (/^-{3,}\s*$/.test(line.trim())) { inHeader = false; continue; }
        const m = line.match(/^([A-Za-z][A-Za-z0-9 _-]*):[ \t]*(.*)$/);
        if (m) { sig[m[1].trim().toLowerCase().replace(/[ -]+/g, '_')] = m[2].trim(); continue; }
        if (!line.trim()) continue;
        inHeader = false;                        // no rule given; the body starts here
      }
      body.push(line);
    }
    sig.body = body.join('\n').trim();
    return sig;
  }

  function wrapText(text, width) {
    const out = [];
    text.split(/\n{2,}/).forEach((para, n) => {
      if (n) out.push('');
      let line = '';
      para.replace(/\s+/g, ' ').trim().split(' ').forEach(word => {
        if (!line) line = word;
        else if ((line + ' ' + word).length <= width) line += ' ' + word;
        else { out.push(line); line = word; }
      });
      if (line) out.push(line);
    });
    return out;
  }

  // Set a signal in teleprinter form, with the defaults from config.js
  function compose(sig) {
    const cfg = Object.assign({
      ship: 'M.Y. KESTREL', callsign: 'GBKW', station: 'V.A. DOVER (DYNAMO)',
      sign: 'ACKNOWLEDGE BY LAMP ON SIGHT.', columns: 38
    }, window.TELEX_CONFIG || {});
    const bar = '='.repeat(cfg.columns);
    const head = [
      ('ZCZC ' + cfg.callsign + ' ' + (sig.serial || '')).trim(),
      'FM  ' + (sig.from || cfg.station),
      'TO  ' + (sig.to || cfg.ship),
      'PRI ' + (sig.priority || 'ROUTINE')
    ];
    if (sig.time) head.push('TOO ' + sig.time);
    head.push(bar);
    const sign = sig.sign !== undefined ? sig.sign : cfg.sign;
    const foot = sign ? [bar, sign, 'NNNN'] : [bar, 'NNNN'];
    const out = head.concat(wrapText(sig.body || '', cfg.columns), foot).join('\n');
    const raw = typeof sig.raw === 'string' ? !/^(no|false|off|0|)$/i.test(sig.raw.trim()) : !!sig.raw;
    return raw ? out : out.toUpperCase();
  }

  function pickSignal() {
    if (!signals.length) return null;
    let sig, guard = 0;
    do sig = signals[Math.floor(Math.random() * signals.length)];
    while (signals.length > 1 && sig === lastSignal && ++guard < 25);
    lastSignal = sig;
    return sig;
  }

  const between = ([lo, hi]) => (lo + Math.random() * (hi - lo)) * 1000;

  function expectSignal(range) {
    clearTimeout(signalTimer);
    signalTimer = setTimeout(incoming, between(range));
  }

  // A signal comes in: the last slip is torn off and a fresh one feeds out.
  // From the helm it's only rows of type, one bar per printed line.
  function incoming() {
    const sig = pickSignal();
    if (!sig) return;
    printed = compose(sig);
    const lines = printed.split('\n');
    const cols = Math.max(...lines.map(l => l.length));

    tx.type.textContent = '';
    for (const line of lines) {
      const row = document.createElement('i');
      row.style.width = (line.trimEnd().length / cols * 100).toFixed(1) + '%';
      tx.type.appendChild(row);
    }

    unread = true;
    tx.root.classList.add('is-calling');
    tx.slip.hidden = false;
    tx.slip.disabled = true;
    tx.slip.style.setProperty('--lines', lines.length);
    tx.slip.style.setProperty('--feed-time', (lines.length * LINE_FEED).toFixed(2) + 's');
    tx.slip.classList.remove('is-feeding');
    void tx.slip.offsetWidth;                    // restart the feed
    tx.slip.classList.add('is-feeding');
    if (stillness.matches) slipFed();
  }

  function slipFed() {
    tx.slip.classList.remove('is-feeding');
    tx.slip.disabled = false;
  }

  tx.slip.addEventListener('animationend', slipFed);

  // Transform that lays the reading sheet over the slip on the desk
  function overSlip(to) {
    const from = tx.slip.getBoundingClientRect();
    return 'translate(' + (from.left - to.left) + 'px,' + (from.top - to.top) + 'px) ' +
           'scale(' + (from.width / to.width) + ',' + (from.height / to.height) + ')';
  }

  function pickUpSlip() {
    if (reading || tx.slip.disabled) return;
    reading = true;
    if (unread) {
      unread = false;
      tx.root.classList.remove('is-calling');
    }
    tx.sheet.textContent = printed;
    tx.sheet.scrollTop = 0;
    tx.view.classList.add('is-open');
    tx.view.setAttribute('aria-hidden', 'false');

    if (!stillness.matches) {
      tx.sheet.style.transition = 'none';
      tx.sheet.style.transform = '';
      tx.sheet.style.transform = overSlip(tx.sheet.getBoundingClientRect());
      void tx.sheet.offsetWidth;
      tx.sheet.style.transition = '';
      tx.sheet.style.transform = '';
    }
    tx.back.focus({ preventScroll: true });
  }

  function putSlipDown() {
    if (!reading) return;
    reading = false;
    if (!stillness.matches) tx.sheet.style.transform = overSlip(tx.sheet.getBoundingClientRect());
    tx.view.classList.remove('is-open');
    tx.view.setAttribute('aria-hidden', 'true');
    tx.slip.focus({ preventScroll: true });
    expectSignal(SIGNAL_GAP);
  }

  tx.slip.addEventListener('click', pickUpSlip);
  tx.back.addEventListener('click', putSlipDown);
  tx.view.addEventListener('click', ev => { if (ev.target === tx.view) putSlipDown(); });
  window.addEventListener('keydown', ev => {
    if (reading && ev.key === 'Escape') putSlipDown();
  });

  // The signal files call TELEX.signal(text); the manifest calls TELEX.load(names).
  const loadScript = src => new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error(src));
    document.head.appendChild(s);
  });

  window.TELEX = {
    signal: text => { const sig = parseSignal(text); signals.push(sig); return sig; },
    load: async names => {
      for (const name of names) {
        try { await loadScript(TELEX_DIR + 'signals/' + name); }
        catch (e) { console.error('[telex] could not load ' + e.message); }
      }
      expectSignal(SIGNAL_FIRST);
    },
    incoming                                     // bring a signal in now, from code
  };

  loadScript(TELEX_DIR + 'config.js')
    .catch(() => {})
    .then(() => loadScript(TELEX_DIR + 'signals/manifest.js'))
    .catch(e => console.error('[telex] could not load ' + e.message));

  buildWorld(el.world, marks);
  buildWorld(gl.world, glassMarks);
  buildSky();
  buildAircraft();
  buildCard();
  layout();
  window.addEventListener('resize', layout);
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
